function startsInfinitive(s){const x=tokens(s)[0]||'';return /(?:ar|er|ir)$/.test(x);}
function overlap(a,b){const aa=meaningful(a),bb=new Set(meaningful(b));return aa.filter(w=>bb.has(w));}
function assess(text,type='general',sp=null){const s=(text||'').trim(),issues=[],good=[];if(!s)return{label:'Pendiente',level:'pending',pct:0,good:[],issues:[{severity:'warn',msg:'Todavía no hay un objetivo redactado. Escribe una oración que exprese qué conocimiento esperas obtener.'}]};const words=tokens(s),verbs=findVerbs(s),first=words[0]||'';
 if(startsInfinitive(s))good.push('Comienza con un verbo en infinitivo, como exige la guía de redacción del semillero.');else issues.push({severity:'bad',msg:'No comienza con un verbo en infinitivo. Inicia con una acción investigativa precisa: medir, caracterizar, analizar, estimar, evaluar, etc.'});
 if(verbs.length>1)issues.push({severity:'bad',msg:'Se detectaron varios posibles verbos en infinitivo ('+[...new Set(verbs)].join(', ')+'). Revisa si estás mezclando propósitos. Esta detección es orientativa.'});else if(verbs.length===1)good.push('No se detectaron otros verbos de acción de la lista del laboratorio.');else if(startsInfinitive(s))issues.push({severity:'warn',msg:'Revisa manualmente si hay más verbos en infinitivo; el detector identifica solo los verbos de su banco.'});
 if(WEAK.has(first))issues.push({severity:'warn',msg:'El verbo «'+first+'» puede expresar una intención poco verificable, una actividad o una intervención no prevista. Justifica su pertinencia o elige uno más preciso.'});
 if(words.length<9)issues.push({severity:'bad',msg:'Es demasiado breve para identificar con claridad qué se estudiará y en qué contexto. Precisa el objeto de estudio.'});else if(words.length>51)issues.push({severity:'warn',msg:'El texto es extenso ('+words.length+' palabras). Revisa si contiene explicaciones metodológicas que corresponden a otra sección.'});else good.push('La extensión es razonable para una primera formulación ('+words.length+' palabras).');
 if(type==='general'){
  if(state.question){const m=overlap(s,state.question);if(m.length>=2)good.push('Comparte conceptos relevantes con la pregunta de investigación ('+m.slice(0,3).join(', ')+').');else issues.push({severity:'warn',msg:'Se encuentran pocas palabras clave comunes con la pregunta problema. Comprueba que ambas expresen exactamente la misma finalidad; la coincidencia de palabras no demuestra coherencia.'});}
  else issues.push({severity:'warn',msg:'Falta la pregunta problema en «Mi proyecto». Sin ella no podemos hacer ni siquiera una comparación inicial de coherencia.'});
  if(state.scope&&overlap(s,state.scope).length===0)issues.push({severity:'warn',msg:'El contexto o la población que escribiste en «Mi proyecto» no aparece de forma reconocible. Comprueba la delimitación.'});
  else if(state.scope)good.push('Contiene referencias que coinciden con el contexto o población declarados.');
  if(state.kind==='correlacional'&&!/(relacion|asociaci|correlaci)/.test(norm(s)))issues.push({severity:'warn',msg:'Marcaste un alcance correlacional, pero no se reconoce expresamente qué relación o asociación estudiarás.'});
 } else {
  if(state.general){const common=overlap(s,state.general);if(common.length>=1)good.push('Comparte elementos temáticos con el objetivo general.');else issues.push({severity:'warn',msg:'No se detectan conceptos relevantes compartidos con el objetivo general; verifica su contribución real.'});}
  else issues.push({severity:'warn',msg:'Aún no has escrito el objetivo general. No puede comprobarse su correspondencia.'});
  if(sp){for(const [key,label] of [['info','información que se requiere'],['method','procedimiento o herramienta'],['evidence','resultado verificable']]){if((sp[key]||'').trim())good.push('Has indicado '+label+'.');else issues.push({severity:'warn',msg:'Falta indicar '+label+'. Sin este dato no se puede juzgar su viabilidad en la matriz.'});}}
 }
 const hard=issues.filter(x=>x.severity==='bad').length,soft=issues.filter(x=>x.severity==='warn').length;const level=hard?'bad':soft?'warn':'good';const label=hard?'No cumple los criterios iniciales':soft?'Necesita ajustes o verificación':'Bien encaminado · revisión preliminar';const pct=Math.max(10,100-hard*28-soft*12);return{label,level,pct,good,issues};}
function statusTag(r){return `<span class="status ${r.level}">${r.level==='good'?'✓ ':r.level==='bad'?'✕ ':r.level==='warn'?'! ':'○ '}${esc(r.label)}</span>`;}
function reviewHtml(r,title='Revisión inmediata'){return `<div class="review"><div class="review-head"><strong>${esc(title)}</strong>${statusTag(r)}</div><ul>${r.good.map(x=>`<li class="good">✓ ${esc(x)}</li>`).join('')}${r.issues.map(x=>`<li class="${x.severity}">${x.severity==='bad'?'✕':'!'} ${esc(x.msg)}</li>`).join('')}</ul><div class="notice" style="margin:0 14px 15px">Esta es una evaluación orientativa por reglas de redacción y coincidencias de texto. No sustituye la revisión metodológica del docente o de la IA con el planteamiento completo.</div></div>`;}

function theory(){return `${head('Escena 02 · Fundamentos','¿Cómo se formulan los objetivos?','Un buen objetivo describe el resultado de conocimiento que buscamos alcanzar, no una lista de tareas que haremos durante el estudio.')}
<div class="panel"><h2>Una regla útil, pero no suficiente</h2><div class="formula"><span>Verbo en infinitivo</span> + qué se estudiará + alcance + contexto</div><p style="margin-top:15px">Para el semillero usaremos <strong>un verbo rector en infinitivo por objetivo</strong>, una redacción breve y coherencia con el título, el problema y la pregunta. Son reglas pedagógicas de escritura, no una ley universal de la ciencia.</p><div class="example-objective"><b>Analizar</b> la relación entre los tiempos de espera y la percepción de calidad del servicio de los clientes en las cafeterías participantes del área urbana de Sahagún durante el primer semestre de 2027.</div></div>

<div class="panel"><h2>Un verbo debe corresponder al propósito real</h2><div class="table-scroll"><table class="thintable"><thead><tr><th>Verbo</th><th>Cuándo utilizarlo</th><th>Ejemplo en las cafeterías</th></tr></thead><tbody><tr><td>Identificar</td><td>Reconocer elementos</td><td>Identificar las etapas del servicio</td></tr><tr><td>Medir</td><td>Obtener valores observables</td><td>Medir minutos de espera</td></tr><tr><td>Caracterizar</td><td>Describir rasgos de un fenómeno</td><td>Caracterizar la percepción del cliente</td></tr><tr><td>Comparar</td><td>Contrastar grupos o condiciones</td><td>Comparar esperas entre franjas</td></tr><tr><td>Estimar</td><td>Calcular valores o relaciones con incertidumbre</td><td>Estimar una asociación</td></tr><tr><td>Analizar</td><td>Examinar relaciones o componentes</td><td>Analizar la relación entre variables</td></tr><tr><td>Evaluar</td><td>Valorar frente a criterios</td><td>Evaluar un estándar definido</td></tr><tr><td>Diseñar</td><td>Desarrollar una solución o modelo</td><td>Diseñar un sistema de atención, solo si el problema lo requiere</td></tr></tbody></table></div><p class="muted" style="font-size:12px;margin-top:13px">Bloom y la revisión de Anderson y Krathwohl ayudan a comprender procesos cognitivos; no establecen una secuencia obligatoria de verbos para todas las investigaciones.</p></div><div class="panel soft"><h3>Referentes metodológicos</h3><p>Hernández Sampieri y Mendoza Torres: congruencia entre problema, preguntas y objetivos. Creswell y Creswell: relación entre propósito, enfoque y métodos. Maxwell: coherencia entre decisiones del diseño. Booth y colaboradores: preguntas investigables con argumentos y evidencia. Anderson y Krathwohl: procesos cognitivos útiles para elegir verbos, sin convertir Bloom en una receta universal.</p><div class="sources-list"><a href="https://us.sagepub.com/en-us/nam/research-design/book270550" target="_blank" rel="noopener">Creswell & Creswell · Research Design</a> · <a href="https://press.uchicago.edu/ucp/books/book/chicago/C/bo215874008" target="_blank" rel="noopener">Booth et al. · The Craft of Research</a> · <a href="https://uwaterloo.ca/centre-for-teaching-excellence/catalogs/tip-sheets/blooms-taxonomy" target="_blank" rel="noopener">Universidad de Waterloo · Bloom</a></div></div>`;}
const QUIZ=[{q:'Un grupo quiere saber cuántos minutos transcurren entre la llegada y el inicio de la atención. ¿Cuál verbo corresponde mejor?',options:['Diseñar','Medir','Garantizar'],a:1,why:'Medir permite registrar una magnitud definida. Diseñar y garantizar comprometen resultados que no se derivan de esta finalidad.'},{q:'¿Cuál formulación expresa una finalidad investigativa y no solo una actividad?',options:['Hacer 100 encuestas','Caracterizar la percepción de calidad del servicio de los clientes','Subir los resultados a Excel'],a:1,why:'El resultado esperado es el conocimiento sobre la percepción. Las encuestas y Excel pueden ser herramientas, no el propósito.'},{q:'«Analizar y evaluar los tiempos de espera para diseñar estrategias» presenta…',options:['Un solo propósito claro','Varios propósitos que exceden el alcance','Una relación estadística demostrada'],a:1,why:'Mezcla varios verbos rectores y promete una intervención no incluida en la pregunta del caso.'},{q:'En el caso de las cafeterías, ¿qué debería analizarse después de medir la espera y recoger la percepción?',options:['La asociación entre ambas variables','El color de las mesas','La intención de mejorar de los dueños'],a:0,why:'La pregunta pide examinar la relación. Los datos deben proceder de las mismas experiencias de servicio para poder vincularse.'},{q:'Si la asociación entre espera y percepción es estadísticamente significativa…',options:['Se demostró causalidad','Puede describirse una asociación, no afirmar automáticamente causa-efecto','Todas las cafeterías atienden mal'],a:1,why:'En un diseño observacional, una asociación no demuestra por sí sola que el tiempo de espera cause el juicio de calidad.'},{q:'¿Cuál es la mejor razón para agregar un objetivo específico?',options:['Llegar obligatoriamente a cinco','Cubrir un resultado necesario que falta para responder la pregunta','Usar el verbo diseñar porque pertenece a Bloom'],a:1,why:'Los objetivos deben ser necesarios y suficientes. No se añade function coverage(){const full=state.specific.map(x=>x.text).join(' '),items=[];if(state.dimensionA){let a=overlap(full,state.dimensionA);items.push({name:'Cobertura del concepto A: '+state.dimensionA,ok:!!a.length,text:a.length?'Se reconoce el concepto entre los específicos.':'No se reconoce con claridad. Comprueba si algún específico realmente estudia este concepto.'});}if(state.dimensionB){let a=overlap(full,state.dimensionB);items.push({name:'Cobertura del concepto B: '+state.dimensionB,ok:!!a.length,text:a.length?'Se reconoce el concepto entre los específicos.':'No se reconoce con claridad. Comprueba si está representado por algún objetivo.'});}if(state.kind==='correlacional'){const yes=/(relacion|asociaci|correlaci|vincul|compar)/.test(norm(full));items.push({name:'Resultado relacional o asociativo',ok:yes,text:yes?'Se reconoce un objetivo que podría abordar la relación entre los conceptos.':'No se identifica un objetivo dedicado a relacionar las variables. Revisa si falta o si debes precisar uno existente.'});}const filled=state.specific.filter(x=>x.text.trim()).length;items.push({name:'Suficiencia del conjunto',ok:filled>=3,text:filled>=3?filled+' objetivos escritos. El número por sí solo no garantiza suficiencia.':filled+' objetivos escritos. Revisa si cubres todos los resultados requeridos; tres o cuatro suelen ser útiles como referencia.'});return items;}
function reviewScene(){const general=assess(state.general),spR=state.specific.map(x=>assess(x.text,'specific',x)),all=[general,...spR],ok=all.filter(x=>x.level==='good').length,needs=all.filter(x=>x.level==='warn').length,errors=all.filter(x=>x.level==='bad'||x.level==='pending').length;const cov=coverage();return `${head('Escena 07 · Coherencia','¿Tus objetivos permiten responder la pregunta?','El objetivo general no se cumple por acumulación de actividades. Verifica que todos los objetivos específicos produzcan información útil, en una secuencia razonable y sin vacíos importantes.')}

function promptMake(type){const data=`TÍTULO: ${state.title||'[Escribe tu título]'}\nPLANTEAMIENTO DEL PROBLEMA: ${state.problem||'[Pega o redacta tu problema]'}\nPREGUNTA PROBLEMA: ${state.question||'[Escribe tu pregunta]'}\nPOBLACIÓN Y CONTEXTO: ${state.scope||'[Indica la población y el lugar]'}\nPERIODO: ${state.period||'[Indica el periodo]'}\nALCANCE PRELIMINAR: ${state.kind||'[Por definir]'}\nOBJETIVO GENERAL: ${state.general||'[Escribe el objetivo general]'}\nOBJETIVOS ESPECÍFICOS:\n${state.specific.map((s,i)=>`${i+1}. ${s.text||'[Pendiente]'}\n   Información necesaria: ${s.info||'[Pendiente]'}\n   Método propuesto: ${s.method||'[Pendiente]'}\n   Evidencia prevista: ${s.evidence||'[Pendiente]'}`).join('\n')}`;

if(type==='general')return `${role}\n\nMIS DATOS:\n${data}\n\nTAREA: Evalúa únicamente mi objetivo general. Para cada criterio explica qué está bien, qué falla y por qué: un solo verbo rector en infinitivo (regla del semillero), precisión del objeto, correspondencia con la pregunta, delimitación temporal y espacial cuando corresponda, alcance realista, viabilidad y resultado verificable. Distingue los problemas graves de las mejoras de estilo. Señala si he confundido correlación con causalidad o incorporado acciones que la pregunta no pide. Redacta una versión corregida solo si hace falta, sin alterar injustificadamente la intención original. Haz hasta tres preguntas si falta información esencial. Termina con un veredicto: cumple / requiere ajustes / no cumple, argumentado. No apruebes el texto solo porque tenga un verbo correcto.`;
if(type==='specific')return `${role}\n\nMIS DATOS:\n${data}\n\nTAREA: Examina los objetivos específicos uno por uno y después el conjunto. Para cada objetivo analiza un solo verbo rector en infinitivo, claridad, contribución al objetivo general, tipo de resultado esperado, información necesaria, técnica coherente, viabilidad y evidencias de cumplimiento. Explica por qué está bien o mal y cómo corregirlo. Detecta repeticiones, objetivos que son solo actividades y promesas de diseño, intervención o causalidad no justificadas. Comprueba si hace falta otro objetivo, si alguno es redundante o si conviene reorganizarlos. No exijas un número fijo de objetivos ni una secuencia obligatoria de Bloom. Presenta tabla con estado (cumple / requiere ajustes / no cumple), razones, cambios puntuales y nueva versión sugerida cuando sea necesaria. Conserva la intención y pide información faltante antes de ampliar el alcance.`;
return `${role}\n\nMIS DATOS:\n${data}\n\nTAREA: Realiza una AUDITORÍA INTEGRAL Y EXIGENTE de formulación de objetivos. 1) Verifica coherencia título → planteamiento → pregunta → general → específicos. 2) Evalúa cada objetivo en forma y fondo: verbo rector, precisión, alcance, secuencia, posibilidad de obtener evidencia y viabilidad. 3) Elabora una matriz objetivo / información requerida / método o herramienta de Ingeniería Industrial / resultado verificable / limitación. 4) Comprueba que los específicos, juntos, sean suficientes para cumplir el general: si falta uno, explica cuál dimensión falta y PREGÚNTAME antes de añadirlo; si sobra uno, justifica su eliminación. 5) Da retroalimentación formativa: lo que está bien y POR QUÉ; lo que está mal, sus consecuencias y la forma de corregirlo; distingue cambios necesarios de sugerencias opcionales. 6) Incluye una propuesta final de redacción únicamente para los objetivos que deban cambiar, con UN verbo rector en infinitivo por objetivo como regla de este semillero. 7) Termina con veredicto: listos para revisión docente / ajustes menores / reformulación importante. No inventes datos ni avales conclusiones prematuras. No confundas asociación con causalidad. No agregues un objetivo de diseño solo porque esté en Bloom. Escribe de manera pedagógica y concreta.`;}

enta de Microsoft Word. Se trata de un archivo .docx real y editable, no de una página HTML renombrada.</p></div>

let crcTab;function crc32(buf){if(!crcTab){crcTab=Array.from({length:256},(_,n)=>{let x=n;for(let j=0;j<8;j++)x=(x&1)?(0xEDB88320^(x>>>1)):(x>>>1);return x>>>0;});}let c=0xFFFFFFFF;for(const b of buf)c=crcTab[(c^b)&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}

function zipStore(files){const parts=[],entries=[];let off=0;for(const [name,contents] of files){const n=enc.encode(name),b=typeof contents==='string'?enc.encode(contents):contents,c=crc32(b);const h=Uint8Array.from([0x50,0x4b,0x03,0x04,...le16(20),...le16(0x0800),...le16(0),...le16(0),...le16(0),...le32(c),...le32(b.length),...le32(b.length),...le16(n.length),...le16(0)]);parts.push(h,n,b);entries.push({n,b,c,off});off+=h.length+n.length+b.length;}const centerStart=off;for(const {n,b,c,off:pos} of entries){const h=Uint8Array.from([0x50,0x4b,0x01,0x02,...le16(20),...le16(20),...le16(0x0800),...le16(0),...le16(0),...le16(0),...le32(c),...le32(b.length),...le32(b.length),...le16(n.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(pos)]);parts.push(h,n);off+=h.length+n.length;}parts.push(Uint8Array.from([0x50,0x4b,0x05,0x06,...le16(0),...le16(0),...le16(entries.length),...le16(entries.length),...le32(off-centerStart),...le32(centerStart),...le16(0)]));return new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});}
function makeDocx(){let body='';body+=wp('SEMILLERO DE INVESTIGACIÓN · INGENIERÍA INDUSTRIAL',{style:'Subtitle'});body+=wp('FORMULACIÓN DE OBJETIVOS DE INVESTIGACIÓN',{style:'Title'});body+=wp('Laboratorio 4 | Mg. Vicky Ruiz',{style:'Subtitle'});body+=wp('Estudiante o equipo: '+(state.name||'Por completar'));body+=wp('Fecha de descarga: '+new Intl.DateTimeFormat('es-CO',{year:'numeric',month:'long',day:'numeric'}).format(new Date()));body+=wp('1. TÍTULO PROVISIONAL',{style:'Heading1'});body+=wp(state.title||'[Pendiente]');body+=wp('2. PLANTEAMIENTO DEL PROBLEMA (SÍNTESIS)',{style:'Heading1'});body+=wp(state.problem||'[Pendiente]');body+=wp('3. PREGUNTA PROBLEMA',{style:'Heading1'});body+=wp(state.question||'[Pendiente]');body+=wp('4. DELIMITACIÓN',{style:'Heading1'});body+=wp('Población y contexto: '+(state.scope||'Por completar'));body+=wp('Periodo: '+(state.period||'Por completar'));body+=wp('Alcance preliminar: '+(state.kind||'Por definir'));body+=wp('5. OBJETIVO GENERAL',{style:'Heading1'});body+=wp(state.general||'[Pendiente]');body+=wp('6. OBJETIVOS ESPECÍFICOS',{style:'Heading1'});state.specific.forEach((s,i)=>{body+=wp((i+1)+'. '+(s.text||'[Pendiente]'))});if(state.exportMatrix){body+=wp('7. MATRIZ DE COHERENCIA',{style:'Heading1'});body+=wordTable([['Objetivo específico','Información requerida','Herramienta o método','Resultado esperado'],...state.specific.map((s,i)=>[(i+1)+'. '+(s.text||'[Pendiente]'),s.info||'[Pendiente]',s.method||'[Pendiente]',s.evidence||'[Pendiente]'])]);}
if(state.exportReview){body+=wp('OBSERVACIONES DE REVISIÓN AUTOMÁTICA',{style:'Heading1'});const list=[['Objetivo general',state.general,assess(state.general)],...state.specific.map((s,i)=>['Objetivo específico '+(i+1),s.text,assess(s.text,'specific',s)])];for(const [name,source,r] of list){body+=wp(name+' — '+r.label,{style:'Heading2'});for(const x of r.good)body+=wp('✓ '+x);for(const x of r.issues)body+=wp('• '+x.msg);}body+=wp('Nota: evaluación automática por reglas de redacción y coincidencias de texto. No constituye aprobación científica ni reemplaza la revisión docente.');}
if(state.exportNotes){body+=wp('NOTAS Y CORRECCIONES DEL ESTUDIANTE',{style:'Heading1'});body+=wp(state.notes||'[No se registraron notas]');}
body+=wp('Documento generado desde el Laboratorio 4 de Objetivos de Investigación. Edición y revisión final a cargo del estudiante y su docente.');body+=`<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1200" w:right="1100" w:bottom="1100" w:left="1100" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>`;
const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}</w:body></w:document>`;
const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos"/><w:sz w:val="21"/><w:color w:val="253748"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:rPr><w:b/><w:color w:val="112A46"/><w:sz w:val="32"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Subtitle"><w:name w:val="Subtitle"/><w:rPr><w:color w:val="176B80"/><w:sz w:val="18"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="200" w:after="70"/><w:keepNext/></w:pPr><w:rPr><w:b/><w:color w:val="112A46"/><w:sz w:val="23"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:rPr><w:b/><w:color w:val="176B80"/><w:sz w:val="21"/></w:rPr></w:style></w:styles>`;
return zipStore([
['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`],
['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`],
['word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
['word/document.xml',documentXml],['word/styles.xml',styles]]);
}
function downloadWord(){saveState();try{const blob=makeDocx();const url=URL.createObjectURL(blob);const a=document.createElement('a');const clean=norm(state.name||'estudiante').replace(/[^a-z0-9]+/g,'_').slice(0,32)||'estudiante';a.href=url;a.download='Objetivos_Investigacion_'+clean+'.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Word generado y enviado a descargas.');}catch(err){console.error(err);toast('No fue posible crear el Word en este navegador. Intenta Chrome o Edge.');}}
setVis(0);render();
</script>
