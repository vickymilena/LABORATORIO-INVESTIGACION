<script>
'use strict';
const STATIONS=[
 {id:1,title:'Descubrir y delimitar',short:'Examinar el GAP',range:'01–05',description:'De los artículos revisados a una pregunta que pueda investigarse.'},
 {id:2,title:'Construir el argumento',short:'Escribir con sentido',range:'06–10',description:'Siete párrafos conectados mediante evidencia y análisis.'},
 {id:3,title:'Respaldar lo escrito',short:'Citar y seleccionar',range:'11–14',description:'APA 7, interpretación de datos y matriz bibliográfica.'},
 {id:4,title:'Comprobar y defender',short:'Validar el problema',range:'15–18',description:'Criterio empírico, IA responsable y revisión final.'}
];
const PARAS=[
 ['Contextualización del fenómeno','¿Qué vamos a estudiar y por qué importa?','Presenta el fenómeno concreto y su relevancia para Ingeniería Industrial.'],
 ['Evidencia de la situación','¿Qué información demuestra que merece investigarse?','Distingue un hecho respaldado de una sospecha.'],
 ['Antecedentes investigativos','¿Qué han encontrado otros estudios?','Compara resultados, métodos y poblaciones.'],
 ['GAP o vacío de conocimiento','¿Qué permanece sin comprender suficientemente?','Sustenta la brecha; no afirmes que nadie investigó.'],
 ['Contextualización local','¿Qué sabemos del contexto elegido?','Separa información documentada de datos pendientes.'],
 ['Problema específico','¿Cuál es la incertidumbre concreta?','Delimita fenómeno, población y contexto.'],
 ['Necesidad del estudio y pregunta','¿Qué investigaremos y por qué?','Cierra el argumento y formula una pregunta coherente.']
];
const PROMPTS=[
 {title:'01 · Analizar la matriz',goal:'Encontrar coincidencias, contradicciones y posibles GAP.',text:'Actúa como investigador senior en Ingeniería Industrial. Analiza la matriz de 20 artículos que adjunto. Identifica hallazgos, coincidencias, contradicciones y posibles GAP. Evalúa cuál oportunidad está mejor sustentada y qué información falta para construir el planteamiento del problema en [territorio y población]. Devuelve una tabla con información disponible, fuente que la respalda, información faltante y acción recomendada. No inventes hallazgos ni referencias; diferencia los vacíos documentados de las hipótesis que requieren validación.'},
 {title:'02 · Buscar información adicional',goal:'Identificar fuentes candidatas para evidencias faltantes.',text:'Actúa como asesor de investigación académica. Necesito completar la evidencia de este problema: [describir problema]. Adjunto los artículos que ya revisé. Identifica datos, antecedentes y fuentes faltantes para [territorio y población]. Si tienes acceso a búsqueda web, localiza documentos científicos e institucionales verificables e indica autor, año, hallazgo pertinente, enlace o DOI y utilidad para el planteamiento. No inventes cifras; marca claramente toda fuente que no hayas podido verificar.'},
 {title:'03 · Construir un primer borrador',goal:'Redactar únicamente con información contrastada.',text:'Actúa como investigador senior y editor académico. Con base exclusivamente en los artículos, datos y referencias verificadas que adjunto, ayúdame a redactar un planteamiento del problema sobre [tema, población y territorio]. Organízalo en siete párrafos: contexto, evidencia, antecedentes, GAP, contexto local, problema específico y necesidad del estudio con pregunta final. Procura una idea central y entre 60 y 100 palabras por párrafo, con citas APA 7 cuando corresponda. No inventes datos ni fuentes; marca [EVIDENCIA PENDIENTE] donde falte sustento y presenta únicamente las referencias realmente utilizadas.'},
 {title:'04 · Revisar como evaluador',goal:'Identificar debilidades antes de entregar.',text:'Evalúa críticamente el planteamiento que adjunto como jurado de un semillero de investigación. Revisa coherencia, claridad del GAP, evidencia empírica, delimitación, viabilidad, pregunta y citas APA 7. Señala afirmaciones sin sustento, generalizaciones, posibles datos inventados y referencias incompletas. Devuelve una tabla con fragmento, problema detectado, gravedad y corrección sugerida. No des por verificadas fuentes que no hayas consultado ni agregues información inventada.'}
];
const SCENES=[
{
 id:1,station:1,minutes:'4 min',title:'¿Es un problema o una sospecha?',sub:'Una percepción puede iniciar una investigación. No puede sustituir la evidencia.',
 guide:'¿Qué diferencia existe entre creer que ocurre algo y demostrarlo?',carry:'Identificar las afirmaciones que todavía necesitan respaldo.',
 lesson:`<div class="little-heading">El caso que nos acompañará</div><p class="lead">Imagina que un equipo quiere investigar la atención al cliente en cafeterías de Sahagún.</p><blockquote>«Las cafeterías de Sahagún tienen problemas de atención porque los clientes esperan demasiado».</blockquote><p>¿Qué información tenemos para sostener esa afirmación? Una experiencia personal puede despertar interés, pero <strong>no demuestra</strong> que la situación afecte a todos los establecimientos, ni que conozcamos sus causas.</p><div class="callout warn"><strong>Alerta del investigador.</strong> Este caso es ilustrativo. No estamos afirmando que existan demoras generalizadas en las cafeterías de Sahagún.</div><h3>Primera distinción</h3><div class="terms"><div class="term"><strong>Percepción o sospecha</strong><p>Lo que pensamos o creemos que podría estar ocurriendo.</p></div><div class="term"><strong>Evidencia</strong><p>Información obtenida o publicada mediante procedimientos que podemos identificar y comprobar.</p></div></div>`,
 activity:{type:'quiz',title:'Antes de afirmar, decide',question:'¿Qué debe hacer el equipo antes de presentar la afirmación como un hecho?',options:['Aceptarla porque un integrante la observó.','Buscar antecedentes pertinentes y comprobar qué información existe sobre el contexto.','Redactar el planteamiento y conseguir las fuentes al final.'],correct:1,why:'Una situación merece examinarse a partir de antecedentes y evidencia apropiada. Por ahora no sabemos si existe un problema generalizado.',wrong:'Las opiniones pueden orientar la búsqueda, pero no prueban magnitud, causas ni consecuencias.',hint:'¿Cuál decisión permite pasar de una impresión personal a una afirmación que se puede defender?'},
 teacher:'Pide a los estudiantes que recuerden problemas que eligieron inicialmente por comentarios informales. Pregunta: «¿Qué evidencia mostraríamos a un comité para defender esa afirmación?».'
},
{
 id:2,station:1,minutes:'8 min',title:'¿Qué encontramos en los 20 artículos?',sub:'Una matriz no es una colección de resúmenes: es un instrumento para comparar conocimiento.',
 guide:'¿Para qué nos sirve realmente la información recogida?',carry:'Reconocer qué se sabe, qué difiere y qué sigue pendiente.',
 lesson:`<p class="lead">Cada equipo revisó artículos y registró objetivos, métodos, hallazgos, limitaciones y preguntas pendientes. Ahora esa matriz debe ayudarnos a <strong>relacionar investigaciones</strong>.</p><p>No basta con leer una fuente tras otra. Debemos preguntarnos en qué coinciden, qué diferencias presentan, cómo llegaron a sus resultados y qué preguntas todavía no pueden responderse.</p><div class="box-scroll"><table class="data-table"><thead><tr><th>Campo de la matriz</th><th>¿Qué permite analizar?</th></tr></thead><tbody><tr><td>Objetivo</td><td>¿Qué quisieron investigar?</td></tr><tr><td>Metodología</td><td>¿Cómo obtuvieron sus resultados?</td></tr><tr><td>Población y contexto</td><td>¿En quiénes y dónde se estudió?</td></tr><tr><td>Hallazgos</td><td>¿Qué encontraron?</td></tr><tr><td>Limitaciones</td><td>¿Qué no pudieron establecer?</td></tr><tr><td>Posible GAP</td><td>¿Qué pregunta sigue abierta?</td></tr></tbody></table></div><div class="callout info"><strong>Importante.</strong> No es obligatorio citar los 20 artículos. Seleccionaremos aquellos que aporten evidencia directamente relacionada con nuestro planteamiento.</div>`,
 activity:{type:'match',title:'Clasifica tres fichas didácticas',intro:'Estas fichas son hipotéticas; no representan artículos científicos reales.',options:['Antecedente hipotético','Diferencia de resultados que debe examinarse','Información local pendiente'],rows:[['Ficha A: un estudio hipotético examina tiempos de espera y satisfacción en ciertos restaurantes.',0,'Representa un posible antecedente. Debemos verificar el estudio real antes de citarlo.'],['Ficha B: otro estudio hipotético, con un procedimiento distinto, no permite concluir la misma relación.',1,'Invita a comparar métodos, poblaciones y resultados; no demuestra por sí solo contradicción.'],['Ficha C: no tenemos datos específicos de la relación en las cafeterías que participarían en Sahagún.',2,'La ausencia de datos locales es información pendiente, no una prueba automática de un GAP.']],hint:'Distingue entre un resultado ya investigado, una diferencia entre estudios y algo que todavía necesita comprobarse.'},
 note:'¿Qué campos de tu matriz contienen las fuentes más relevantes y cuáles están incompletos?',
 teacher:'Pide que abran su matriz real. Distingue cantidad de fuentes y utilidad de las fuentes. Pregunta cuál de sus artículos podrían utilizar para sustentar una afirmación concreta.'
},
{
 id:3,station:1,minutes:'7 min',title:'Las cinco formas de encontrar un GAP',sub:'Un vacío es una limitación del conocimiento disponible, no una etiqueta para cualquier tema.',
 guide:'¿Dónde se encuentra exactamente lo que todavía no se comprende?',carry:'Clasificación argumentada de un posible GAP.',
 lesson:`<p class="lead">Un GAP es un aspecto que la evidencia todavía no explica suficientemente o sobre el que existen resultados inconsistentes o limitaciones relevantes.</p><div class="step-list"><div class="step"><span class="step-num">01</span><div><strong>Territorio</strong><p>Se requiere comprender un fenómeno en un contexto particular que no queda suficientemente explicado por los estudios disponibles.</p></div></div><div class="step"><span class="step-num">02</span><div><strong>Población</strong><p>Los estudios se concentran, por ejemplo, en grandes empresas, pero existe una pregunta relevante acerca de micronegocios.</p></div></div><div class="step"><span class="step-num">03</span><div><strong>Variables</strong><p>Se han estudiado determinados factores por separado y queda por examinar una relación importante.</p></div></div><div class="step"><span class="step-num">04</span><div><strong>Metodología</strong><p>Los procedimientos utilizados tienen limitaciones para responder una pregunta concreta.</p></div></div><div class="step"><span class="step-num">05</span><div><strong>Resultados</strong><p>Las investigaciones presentan diferencias que necesitan análisis o explicación.</p></div></div></div><p>Una misma oportunidad podría relacionarse con varios tipos de GAP. La clasificación ayuda a pensar, pero <strong>no sustituye la justificación</strong>.</p>`,
 activity:{type:'match',title:'Reconoce el tipo de vacío',intro:'Los tres ejemplos son escenarios de práctica.',options:['Territorio','Población','Variables','Metodología','Resultados'],rows:[['Los estudios se concentran en empresas grandes; queda una pregunta relevante sobre micronegocios.',1,'La diferencia principal está en quiénes fueron estudiados.'],['Dos trabajos pertinentes presentan resultados distintos para la misma relación.',4,'La diferencia principal está en sus hallazgos, aunque habrá que revisar métodos y poblaciones.'],['Los estudios utilizaron definiciones de tiempo de espera que no son comparables.',3,'La dificultad está en cómo se definió o midió la variable.']],hint:'Pregúntate si la limitación se debe a las personas estudiadas, a los resultados o a la forma de investigar.'},
 teacher:'Aclara que no haber encontrado estudios sobre Sahagún no prueba que exista un problema local. El GAP requiere evidencia de su pertinencia.'
},
{
 id:4,station:1,minutes:'7 min',title:'¿Vale la pena investigar este vacío?',sub:'Un vacío documentado debe ser pertinente y razonablemente viable.',
 guide:'¿Cómo distinguimos una oportunidad sólida de una afirmación exagerada?',carry:'Primer criterio de selección del GAP.',
 lesson:`<p class="lead">No todo tema poco estudiado merece convertirse en una investigación. El GAP orienta el proyecto, pero no demuestra automáticamente que exista una dificultad práctica.</p><p>Antes de seleccionar una brecha, debemos considerar: <strong>respaldo</strong> en la literatura, <strong>relevancia</strong> de la pregunta y <strong>viabilidad</strong> para investigarla.</p><div class="terms"><div class="term"><strong>Respaldo</strong><p>¿Los estudios revisados muestran realmente el límite de conocimiento?</p></div><div class="term"><strong>Relevancia</strong><p>¿Por qué sería importante comprender esa pregunta?</p></div><div class="term"><strong>Viabilidad</strong><p>¿Podemos obtener la información y acceder a la población?</p></div><div class="term"><strong>Precisión</strong><p>¿Está formulado como una pregunta específica y no como una generalización?</p></div></div><div class="callout warn">Después de revisar 20 artículos, no es riguroso afirmar «nadie ha investigado este tema» sin una búsqueda más amplia y una justificación apropiada.</div>`,
 activity:{type:'quiz',title:'Elige el argumento responsable',question:'¿Qué afirmación es el mejor punto de partida para el caso ilustrativo?',options:['Nadie ha estudiado las cafeterías de Sahagún, así que está demostrado que hay mala atención.','Si los antecedentes pertinentes lo respaldan, podemos examinar si la relación entre tiempo de espera y calidad percibida merece estudiarse en cafeterías seleccionadas.','Todos los clientes de Sahagún están insatisfechos, aunque todavía no haya encuestas.'],correct:1,why:'El argumento plantea una oportunidad de investigación condicionada a evidencia y pertinencia, sin declarar como hechos las sospechas.',wrong:'Una afirmación universal o un problema local supuesto no se convierten en hechos por redactarse con seguridad.',hint:'Desconfía de «todos» y «nadie» cuando no hay información que respalde esas generalizaciones.'},
 note:'Escribe tu posible GAP sin afirmar que el problema ya está demostrado.',
 teacher:'Pregunta si los equipos podrían defender ante un comité que «nadie investigó el tema» basándose únicamente en 20 artículos.'
},
{
 id:5,station:1,minutes:'12 min',title:'De un tema amplio a una pregunta precisa',sub:'Delimitamos fenómeno, población, territorio y periodo sin forzar conclusiones.',
 guide:'¿Qué queremos conocer exactamente y bajo qué condiciones?',carry:'Pregunta preliminar que deberá revisarse con evidencia y viabilidad.',
 lesson:`<p class="lead">Para construir la pregunta seguimos cinco decisiones: comprender el fenómeno, examinar la evidencia, reconocer lo desconocido, verificar el contexto y formular el problema.</p><div class="chain"><span>Tema general</span><b>→</b><span>Posible GAP</span><b>→</b><span>Situación desconocida</span><b>→</b><span>Delimitación</span><b>→</b><span>Pregunta</span></div><h3>Ejemplo ilustrativo</h3><div class="step-list"><div class="step"><span class="step-num">1</span><div><strong>Tema</strong><p>Calidad del servicio al cliente.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Posible GAP</strong><p>Insuficiente evidencia sobre una relación específica en los establecimientos seleccionados. Debe verificarse en la literatura.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>Fenómeno</strong><p>Relación entre tiempos de espera y percepción de calidad.</p></div></div><div class="step"><span class="step-num">4</span><div><strong>Delimitación</strong><p>Clientes de cafeterías participantes del área urbana de Sahagún, primer semestre de 2027.</p></div></div></div><blockquote>¿Qué relación existe entre los tiempos de espera y la percepción de calidad del servicio de los clientes en las cafeterías participantes del área urbana de Sahagún durante el primer semestre de 2027?</blockquote><p class="note">La pregunta es provisional. El equipo debe comprobar el GAP y la viabilidad de obtener información.</p>`,
 activity:{type:'builder',title:'Construye tu delimitación',hint:'La estructura que aparecerá es una guía, no una pregunta académicamente aprobada.'},
 teacher:'Invita a comparar las preguntas de los equipos con su matriz. Pregunta qué variables y qué población podrán estudiar en la práctica.'
},
{
 id:6,station:2,minutes:'8 min',title:'La arquitectura de los siete párrafos',sub:'Cada bloque cumple una función dentro de un argumento continuo.',
 guide:'¿Qué debe aportar cada párrafo y qué pregunta responde?',carry:'Plano argumentativo antes de redactar.',
 lesson:`<p class="lead">El planteamiento del problema explica qué situación necesita investigarse, qué se conoce sobre ella, qué permanece sin comprender y por qué el estudio es pertinente.</p><p>En el semillero utilizaremos una estructura pedagógica de <strong>siete párrafos</strong>. Es una orientación para comenzar a escribir, <strong>no una regla de APA 7</strong>.</p><div class="step-list">${PARAS.map((p,i)=>`<div class="step"><span class="step-num">${i+1}</span><div><strong>${p[0]}</strong><p>${p[1]}</p></div></div>`).join('')}</div><p>Si quitamos un párrafo y el texto no pierde información importante, debemos revisar si ese párrafo realmente contribuye al argumento.</p>`,
 activity:{type:'match',title:'¿Qué función cumple cada afirmación?',options:['Contextualización del fenómeno','Antecedentes investigativos','GAP'],rows:[['La prestación de servicios incluye procesos que pueden examinarse desde la Ingeniería Industrial.',0,'Presenta el fenómeno y su relación con la disciplina; requiere fuente si incorpora una idea externa.'],['Los trabajos revisados encontraron resultados diferentes que deben compararse según sus métodos.',1,'Integra estudios previos y sus hallazgos, si estos están documentados.'],['La evidencia comparada todavía no permite responder una pregunta relevante sobre la relación estudiada.',2,'Delimita la falta de conocimiento, siempre que las fuentes lo sustenten.']],hint:'¿La frase introduce el fenómeno, compara lo encontrado o explica lo que permanece sin comprender?'},
 teacher:'Explica la estructura como una argumentación progresiva. Pregunta qué pasaría si se formulara la pregunta sin mostrar por qué es necesaria.'
},
{
 id:7,station:2,minutes:'12 min',title:'Cómo comenzar con evidencia',sub:'Párrafos 1 y 2: presentar el fenómeno y justificar su estudio.',
 guide:'¿Qué diferencia existe entre contextualizar y demostrar pertinencia?',carry:'Primer borrador de contextualización y evidencia.',
 lesson:`<h3>Párrafo 1 · Contextualización del fenómeno</h3><p>Presenta el aspecto concreto que se investigará y su importancia desde la disciplina. Evita comenzar con afirmaciones universales o historias demasiado amplias.</p><h3>Párrafo 2 · Evidencia de la situación</h3><p>Utiliza resultados de estudios, estadísticas, informes o diagnósticos que <strong>realmente respalden</strong> la situación o incertidumbre. No extrapoles datos de otra ciudad al territorio seleccionado.</p><div class="callout warn"><strong>Inicio débil:</strong> «Desde el inicio de la humanidad, las empresas han buscado satisfacer a sus clientes. Hoy todas las cafeterías necesitan mejorar la atención porque sus consumidores siempre esperan demasiado».</div><div class="callout good"><strong>Inicio ilustrativo más preciso:</strong> «Los tiempos de espera constituyen una dimensión observable de los procesos de atención al cliente. Su estudio permitiría examinar una etapa del servicio y una posible relación con la calidad percibida». <em>Para un documento real, deberán incorporarse las fuentes pertinentes.</em></div><p>La primera versión contiene generalidades innecesarias y afirmaciones sin evidencia. La segunda delimita el asunto, pero todavía necesita respaldo documental.</p>`,
 activity:{type:'quiz',title:'Detecta la mayor debilidad',question:'¿Cuál es el defecto principal del inicio débil?',options:['Contiene palabras demasiado breves.','Afirma una situación generalizada sin respaldo y no delimita bien el fenómeno.','No utiliza suficientes adjetivos.'],correct:1,why:'Un planteamiento necesita precisión y evidencia. La calidad no se consigue alargando frases o usando palabras complejas.',wrong:'No es un problema de longitud o estilo decorativo: faltan delimitación y respaldo para las afirmaciones.',hint:'Busca las expresiones «todas», «siempre» y las afirmaciones que el texto no demuestra.'},
 note:'Redacta una apertura sobre tu fenómeno y anota qué fuente usarías para respaldarla.',
 teacher:'Lee las dos versiones y pide que señalen qué frase concreta requiere una fuente. Insiste en que escribir con claridad es más valioso que redactar de manera grandilocuente.'
},
{
 id:8,station:2,minutes:'15 min',title:'De los antecedentes al GAP',sub:'Párrafos 3 y 4: comparar estudios antes de declarar una brecha.',
 guide:'¿Qué sabemos y qué sigue siendo incierto después de comparar la literatura?',carry:'Síntesis comparativa y formulación cautelosa del GAP.',
 lesson:`<p class="lead">Un antecedente no se incluye solamente porque se parece al tema. Debe aportar un resultado, un método o una limitación que permita avanzar el argumento.</p><h3>Párrafo 3 · Antecedentes investigativos</h3><p>Compara lo que encontraron otros investigadores. Identifica coincidencias, diferencias y relaciones; evita escribir un artículo tras otro sin analizarlos.</p><h3>Párrafo 4 · GAP</h3><p>Explica el aspecto que la evidencia no resuelve suficientemente. Para afirmar un GAP, identifica <strong>qué estudios revisaste y cuál es el límite específico</strong> que dejan.</p><div class="callout info"><strong>Fichas de práctica simuladas:</strong> A encuentra una asociación entre espera y satisfacción; B no obtiene un resultado concluyente en otra población; C utiliza una definición distinta de tiempo de espera. No son artículos reales.</div><p>Antes de concluir que los estudios se contradicen, revisa las diferencias entre poblaciones, procedimientos, definiciones de variables y resultados.</p><blockquote>Ejemplo de síntesis didáctica: «Las fichas presentan resultados que podrían interpretarse de maneras diferentes. Antes de considerarlos una contradicción científica, sería necesario comparar sus métodos, poblaciones y definiciones de las variables».</blockquote>`,
 activity:{type:'match',title:'¿Qué revisarías antes de declarar un GAP?',options:['Comparación pertinente','Inferencia injustificada'],rows:[['Comprobar si los estudios midieron la misma variable con criterios comparables.',0,'La definición y la medición condicionan la interpretación.'],['Concluir que en Sahagún hay mala atención porque los estudios A y B difieren.',1,'Los estudios hipotéticos no demuestran una situación local.'],['Examinar diferencias entre los participantes y procedimientos de los estudios.',0,'La población y el método pueden explicar resultados distintos.']],hint:'Una diferencia de resultados solo puede interpretarse después de revisar el contexto y cómo se obtuvo.'},
 note:'Compara al menos dos antecedentes reales de tu matriz e indica la limitación que consideras más importante.',
 teacher:'Pregunta «¿Dos estudios diferentes se contradicen necesariamente?». Evita que el alumnado utilice fichas simuladas como antecedentes reales.'
},
{
 id:9,station:2,minutes:'15 min',title:'Del contexto local a la pregunta',sub:'Párrafos 5, 6 y 7: completar el argumento sin inventar hechos.',
 guide:'¿Cómo se conecta la incertidumbre específica con la pregunta de investigación?',carry:'Cierre argumentativo y pregunta coherente.',
 lesson:`<h3>Párrafo 5 · Contextualización local</h3><p>Relaciona el fenómeno con el territorio, la población o el sector. Las fuentes pueden incluir datos de instituciones y documentos pertinentes, siempre que <strong>contengan realmente</strong> la información que necesitamos.</p><div class="callout warn">Un informe sobre actividad comercial del municipio no demuestra, por sí solo, que existan demoras en cafeterías.</div><h3>Párrafo 6 · Problema específico</h3><p>Integra qué sabemos, qué desconocemos y a quiénes o qué involucra. No atribuyas consecuencias o causas sin evidencia.</p><h3>Párrafo 7 · Necesidad del estudio y pregunta</h3><p>Explica qué conocimiento se espera obtener y formula una pregunta que se desprenda del argumento anterior.</p><blockquote>¿Qué relación existe entre los tiempos de espera y la percepción de calidad del servicio de los clientes en las cafeterías participantes del área urbana de Sahagún durante el primer semestre de 2027?</blockquote><p class="note">Es un ejemplo preliminar. Su pertinencia debe verificarse con fuentes y posibilidades reales de acceso.</p>`,
 activity:{type:'order',title:'Ordena el cierre del planteamiento',intro:'Asigna a cada elemento el lugar que ocupa en la secuencia argumentativa.',items:[['A. Identificar qué relación permanece desconocida en las cafeterías seleccionadas.',1],['B. Explicar por qué sería pertinente obtener información sobre esa relación.',2],['C. Formular la pregunta central correspondiente.',3]],hint:'Primero delimita lo desconocido; después justifica el estudio; finalmente formula la pregunta.'},
 note:'Escribe qué información local tienes y cuál todavía debes comprobar antes de redactar tu cierre.',
 teacher:'Pregunta: «¿Si quitamos el GAP, la pregunta seguiría justificándose?». No permitas que se presente la inexistencia de datos como una dificultad empírica ya demostrada.'
},
{
 id:10,station:2,minutes:'10 min',title:'Anatomía de un párrafo académico',sub:'Idea central, evidencia, análisis y conexión: cuatro funciones diferentes.',
 guide:'¿Qué hace que un párrafo argumente y no solo enumere citas?',carry:'Versión revisada de un párrafo del proyecto.',
 lesson:`<p class="lead">Cada párrafo debe desarrollar una idea central y contribuir al planteamiento. Una estrategia útil es examinar cuatro componentes:</p><div class="step-list"><div class="step"><span class="step-num">1</span><div><strong>Idea central</strong><p>Presenta claramente lo que se quiere comunicar.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Evidencia</strong><p>Respalda la idea con investigaciones o información verificable; se citan los aportes ajenos.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>Análisis</strong><p>Explica qué significa esa evidencia para nuestro proyecto.</p></div></div><div class="step"><span class="step-num">4</span><div><strong>Conexión</strong><p>Relaciona la idea con la siguiente parte del argumento.</p></div></div></div><div class="reference"><strong>Modelo con fuente identificada en el capítulo.</strong><br>La identificación de vacíos de investigación requiere examinar la suficiencia y las limitaciones de la evidencia. Robinson et al. (2011) desarrollaron un marco que considera, entre otros aspectos, información insuficiente e inconsistencia de resultados. Este aporte permite comprender que un GAP no se reduce a encontrar un tema poco estudiado. Por ello, antes de formular una pregunta, resulta necesario analizar críticamente los estudios disponibles.</div><h3>La extensión no garantiza calidad</h3><p>Para los ejercicios iniciales podemos orientar la escritura hacia tres a cinco oraciones y aproximadamente 60 a 100 palabras por párrafo. Un primer planteamiento podría tener unas 500 a 750 palabras. <strong>Estas son orientaciones del semillero, no obligaciones de APA 7.</strong></p>`,
 activity:{type:'quiz',title:'¿Qué le falta al fragmento?',question:'«Robinson et al. (2011) estudiaron los vacíos de investigación. Por eso es importante investigar». ¿Qué necesita mejorar?',options:['Solamente el número de palabras.','Explicar el aporte de la fuente y su relación con el problema investigado.','Eliminar la referencia para que la idea parezca propia.'],correct:1,why:'Identificar al autor no es suficiente: hay que explicar qué encontró o aportó y por qué resulta relevante para el argumento.',wrong:'Ni alargar sin propósito ni ocultar una fuente fortalecen un texto académico.',hint:'¿Qué aporta concretamente esa investigación y cómo lo utiliza tu proyecto?'},
 note:'Reescribe un párrafo de tu proyecto usando idea central, evidencia, análisis y conexión.',
 teacher:'Pide que localicen la oración que interpreta la evidencia, diferenciándola de la que atribuye una idea a un autor.'
},
{
 id:11,station:3,minutes:'10 min',title:'Citar no es copiar ni acumular autores',sub:'APA 7: citas narrativas, parentéticas y paráfrasis responsable.',
 guide:'¿De quién es la idea y cómo podemos reconocer su procedencia?',carry:'Atribución correcta de información académica.',
 lesson:`<p class="lead">APA 7 utiliza el sistema autor-fecha. Citar es reconocer la procedencia de conceptos, datos, resultados e ideas ajenas.</p><div class="terms"><div class="term"><strong>Cita narrativa</strong><p>Robinson et al. (2011) desarrollaron un marco para identificar vacíos de investigación.</p></div><div class="term"><strong>Cita parentética</strong><p>Los vacíos pueden relacionarse con limitaciones de la evidencia (Robinson et al., 2011).</p></div></div><div class="box-scroll"><table class="data-table"><thead><tr><th>Autoría</th><th>Ejemplo parentético de formato</th></tr></thead><tbody><tr><td>Un autor</td><td>(Apellido, 2024)</td></tr><tr><td>Dos autores</td><td>(Apellido &amp; Apellido, 2024)</td></tr><tr><td>Tres o más</td><td>(Apellido et al., 2024)</td></tr><tr><td>Institución</td><td>(Nombre de la institución, 2024)</td></tr></tbody></table></div><p class="note">Los apellidos y fechas genéricos ilustran formatos, no son referencias reales. En citas narrativas redactadas en español se usa habitualmente «y» entre dos autores; en parentéticas, «&amp;».</p><div class="callout info"><strong>Parafrasear también exige citar.</strong> Utilizar nuestras propias palabras no convierte en propia una idea que procede de otra publicación.</div>`,
 activity:{type:'match',title:'Selecciona la forma de atribución',intro:'Clasifica los modelos de cita que se muestran.',options:['Cita narrativa','Cita parentética','Paráfrasis sin atribución suficiente'],rows:[['Robinson et al. (2011) proponen un marco para identificar GAP.',0,'El autor aparece integrado en la oración.'],['Un GAP puede evidenciar una limitación del conocimiento disponible (Robinson et al., 2011).',1,'La atribución se incluye entre paréntesis.'],['Leí que hay muchos tipos de GAP; por eso digo que la idea es mía.',2,'Cambiar palabras no elimina la obligación de citar la fuente de la idea.']],hint:'Observa dónde aparecen autor y año y si se reconoce la procedencia de la idea.'},
 note:'Selecciona una idea de un artículo real y escribe una paráfrasis con la cita que corresponda.',
 teacher:'Pregunta «¿Qué parte de nuestra escritura es hallazgo del autor y cuál es interpretación del equipo?». Insiste en consultar el original.'
},
{
 id:12,station:3,minutes:'9 min',title:'¿Qué demuestra realmente una cifra?',sub:'Los datos deben interpretarse según su población, periodo, indicador y método.',
 guide:'¿A quiénes describe una cifra y qué afirmaciones permite sostener?',carry:'Criterios para usar evidencia cuantitativa sin generalizaciones.',
 lesson:`<p class="lead">Antes de incluir una estadística, averigua quién la produjo, cuándo, con qué procedimiento, qué población o territorio describe y cuál es el indicador.</p><div class="callout warn"><strong>Datos ficticios de práctica:</strong> en una encuesta hipotética, seis de diez participantes califican negativamente un aspecto del servicio. Eso no demuestra que el 60 % de todos los clientes de Sahagún esté insatisfecho.</div><p>Una proporción observada en un grupo no se puede trasladar automáticamente a una población mayor. También importa cómo se seleccionaron los participantes, qué se preguntó y cuándo se obtuvieron los datos.</p><h3>Cuando usamos palabras exactas de una fuente</h3><div class="terms"><div class="term"><strong>Menos de 40 palabras</strong><p>Cita breve entre comillas, con autor, año y página o localizador adecuado.</p></div><div class="term"><strong>40 palabras o más</strong><p>Cita en bloque, sin comillas y con sangría, acompañada de la atribución correspondiente.</p></div></div><p>En el semillero priorizaremos la paráfrasis crítica, porque ayuda a demostrar comprensión.</p>`,
 activity:{type:'quiz',title:'¿Cuál afirmación permite el ejercicio?',question:'Seis de diez participantes hipotéticos califican negativamente un aspecto del servicio. ¿Qué podemos sostener?',options:['Que el 60 % de los habitantes de Sahagún está insatisfecho.','Que seis de esos diez participantes dieron una calificación negativa al aspecto evaluado.','Que el tiempo de espera es la causa demostrada de esa calificación.'],correct:1,why:'El resultado describe las respuestas de diez participantes hipotéticos; no representa sin más a toda una población ni demuestra causalidad.',wrong:'No generalices desde una práctica simulada ni infieras causas que no fueron medidas.',hint:'¿Cuál alternativa describe exactamente a quienes respondieron, sin extender la conclusión?'},
 note:'Anota un indicador que usarías en tu proyecto y qué información necesitas para interpretarlo.',
 teacher:'Pregunta qué diseño muestral se necesitaría para sostener una conclusión poblacional. Revisa junto al grupo un ejemplo de cita textual breve y uno en bloque.'
},
{
 id:13,station:3,minutes:'8 min',title:'De la cita a la referencia verificable',sub:'Una referencia debe conducir al documento y respaldar la afirmación.',
 guide:'¿Otra persona podría localizar la obra con los datos que ofrecemos?',carry:'Revisión de referencias bibliográficas y correspondencia con citas.',
 lesson:`<p class="lead">Una referencia completa permite identificar la obra que utilizamos y localizarla. Para artículos científicos, normalmente se registran autoría, año, título, revista, volumen, número, páginas o identificador y DOI cuando exista.</p><div class="reference">Robinson, K. A., Saldanha, I. J., &amp; McKoy, N. A. (2011). Development of a framework to identify research gaps from systematic reviews. <em>Journal of Clinical Epidemiology, 64</em>(12), 1325–1330. <a href="https://doi.org/10.1016/j.jclinepi.2011.06.009" target="_blank" rel="noopener noreferrer">https://doi.org/10.1016/j.jclinepi.2011.06.009 ↗</a></div><h3>Comprueba siempre dos cosas</h3><ol><li>Que la referencia corresponde a una publicación identificable y sus datos son correctos.</li><li>Que la publicación contiene información pertinente para la afirmación que quieres respaldar.</li></ol><p>La lista de referencias se organiza alfabéticamente, con interlineado doble y sangría francesa de 1,27 cm según APA 7.</p><div class="callout info">Una referencia bien formateada no garantiza que respalde una afirmación. La lectura y verificación del original siguen siendo indispensables.</div>`,
 activity:{type:'match',title:'Auditor de referencias',intro:'¿Cuál es el problema de cada ejemplo?',options:['Referencia incompleta','Uso correcto como referencia ilustrativa','Afirmación que requiere verificación del contenido'],rows:[['«Robinson y otros. Los vacíos de investigación. 2011».',0,'No incluye los datos bibliográficos suficientes ni el formato APA adecuado.'],['La referencia completa de Robinson et al. (2011) mostrada arriba.',1,'Es el ejemplo identificado en el capítulo y presenta los datos necesarios del artículo.'],['«La referencia existe, por tanto demuestra mala atención en Sahagún».',2,'La existencia de una publicación no prueba cualquier afirmación, y menos una situación local no examinada.']],hint:'Distingue entre forma de la referencia y pertinencia de lo que queremos demostrar.'},
 note:'Registra una referencia que uses y explica exactamente qué afirmación tuya respalda.',
 teacher:'Invita a abrir un artículo y localizar autor, año, título, revista y DOI; aclara que el DOI no sustituye la lectura.'
},
{
 id:14,station:3,minutes:'18 min',title:'Taller: de los 20 artículos a los siete párrafos',sub:'Selecciona fuentes, compara hallazgos y registra evidencia pendiente.',
 guide:'¿Qué aporta cada artículo al argumento y en qué párrafo sirve?',carry:'Biblioteca de fuentes organizadas por utilidad y respaldo.',
 lesson:`<p class="lead">Tu matriz es la herramienta principal para empezar el planteamiento. No necesitas citar todos los artículos: selecciona los que tengan relación directa con lo que quieres argumentar.</p><div class="step-list"><div class="step"><span class="step-num">1</span><div><strong>Revisa tu síntesis GAP</strong><p>Prioriza una oportunidad fundamentada y viable.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Selecciona fuentes pertinentes</strong><p>Registra referencia, hallazgo, contexto, método y limitaciones.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>Relaciona con los siete párrafos</strong><p>Explica qué afirmación concreta permite sustentar cada trabajo.</p></div></div><div class="step"><span class="step-num">4</span><div><strong>Registra lo que falta</strong><p>Utiliza [EVIDENCIA PENDIENTE] si todavía no cuentas con respaldo suficiente.</p></div></div></div><p>Un mismo artículo puede aportar a varias secciones. Evita presentar las fuentes como probadas si solo cuentas con una referencia incompleta o un resumen producido por IA.</p><div class="callout info"><strong>Tu material real.</strong> El capítulo explica la matriz, pero no incluye sus 20 registros. Este taller comienza vacío para que cada equipo introduzca sus artículos sin que la aplicación invente resultados.</div>`,
 activity:{type:'sources',title:'Mi mesa bibliográfica',hint:'Utiliza tu matriz real. Puedes registrar fuentes manualmente o importar un CSV con columnas identificables.'},
 teacher:'Revisa si cada fuente respalda la afirmación que se le asigna y pide que justifiquen por qué la usaron. El taller permite registrar fuentes, pero no verifica automáticamente su contenido.'
},
{
 id:15,station:4,minutes:'10 min',title:'¿Y si no encontramos datos de Sahagún?',sub:'La ausencia de información local obliga a revisar la evidencia, no a inventarla.',
 guide:'¿Falta una medición local o falta sustento para la pregunta?',carry:'Ruta responsable para resolver información faltante.',
 lesson:`<p class="lead">Puede haber estudios sobre un fenómeno en otros territorios y poca información específica para el municipio. Eso no significa automáticamente que debamos abandonar la investigación ni que podamos completar el vacío con suposiciones.</p><div class="terms"><div class="term"><strong>Camino A: antecedentes pertinentes</strong><p>Hay respaldo de que el fenómeno merece estudiarse, pero faltan mediciones locales. Podría ser razonable obtener nuevos datos si tenemos acceso y recursos.</p></div><div class="term"><strong>Camino B: pertinencia no sustentada</strong><p>No contamos con información suficiente para justificar por qué estudiar el fenómeno en ese contexto. Debemos ampliar la búsqueda, ajustar o replantear.</p></div></div><h3>Fuentes candidatas, no pruebas automáticas</h3><p>Se pueden consultar el DANE, entidades territoriales, cámaras de comercio y estudios comparables. Antes de citarlos, verifica qué indicador contiene cada documento y a qué población y periodo corresponde.</p><blockquote>Una formulación prudente puede indicar que es necesario establecer si existe evidencia local específica, sin afirmar que el problema práctico ya está demostrado.</blockquote>`,
 activity:{type:'quiz',title:'Elige el camino responsable',question:'Tienes antecedentes pertinentes, pero aún no encuentras mediciones específicas de las cafeterías seleccionadas. ¿Qué haces?',options:['Afirmas que existe un problema generalizado porque faltan estadísticas locales.','Amplías la búsqueda, verificas la pertinencia y examinas si puedes obtener datos locales de manera viable.','Inventas una cifra temporal para poder avanzar.'],correct:1,why:'Cuando hay pertinencia documentada pero faltan mediciones locales, es necesario comprobar qué información adicional puede obtenerse.',wrong:'La falta de datos no demuestra un problema ni autoriza a inventar cifras.',hint:'Identifica la opción que mantiene la propuesta como pregunta y busca evidencia para examinarla.'},
 note:'Identifica una fuente local que necesites y una alternativa razonable si no encuentras el dato.',
 teacher:'Pregunta qué fuentes podrían describir el sector y cuáles medirían realmente el indicador propuesto. Diferencia contexto comercial y tiempos de servicio.'
},
{
 id:16,station:4,minutes:'12 min',title:'El criterio empírico: comprobar antes de afirmar',sub:'Definir indicadores y procedimientos limita qué conclusiones podemos defender.',
 guide:'¿Qué mediríamos, cómo lo haríamos y qué puede afirmarse con esos datos?',carry:'Indicador definido y conclusiones acordes con la evidencia.',
 lesson:`<p class="lead">El criterio empírico exige que las afirmaciones sobre hechos observables puedan contrastarse con datos obtenidos mediante procedimientos identificables y verificables.</p><p>Podemos utilizar mediciones de tiempo, registros, observaciones estructuradas, encuestas o entrevistas, siempre que sean pertinentes. Si queremos estudiar demoras, primero debemos definir exactamente qué significa <strong>tiempo de espera</strong>.</p><div class="callout info"><strong>Definición de práctica:</strong> intervalo desde la llegada del cliente hasta el comienzo de la atención. Unidad: minutos. Esto es solo un indicador ilustrativo; el equipo debe justificar la definición real que adopte.</div><p>La percepción del servicio necesitaría, además, un instrumento apropiado para recogerla. Medir tiempos no nos dice automáticamente si una persona está satisfecha.</p><h3>Cinco pruebas para la evidencia</h3><ol><li>¿Es verificable?</li><li>¿Es pertinente para el problema?</li><li>¿Corresponde al contexto y periodo?</li><li>¿Es suficientemente sólida?</li><li>¿Podemos obtener nuevos datos con acceso, recursos y permisos?</li></ol><p class="note">Toda recolección real deberá atender consentimiento informado, confidencialidad, protección de datos y exigencias éticas o institucionales aplicables.</p>`,
 activity:{type:'lab',title:'Simulador de cuatro observaciones ficticias',hint:'Puedes modificar los tiempos para observar cómo cambian los resultados. Ninguno representa datos reales.'},
 note:'Define un indicador de tu proyecto: inicio, fin o unidad de medida y procedimiento de recolección.',
 teacher:'Relaciona el indicador con mediciones industriales. Pregunta qué datos harían falta para conocer la percepción de calidad y por qué cuatro observaciones no demuestran un resultado general.'
},
{
 id:17,station:4,minutes:'12 min',title:'La IA como asistente, no como investigador',sub:'Usar prompts para apoyar tareas concretas sin delegar el criterio científico.',
 guide:'¿Qué puede ayudarnos a organizar la IA y qué debemos comprobar nosotros?',carry:'Uso responsable de prompts y registro del trabajo con IA.',
 lesson:`<p class="lead">La inteligencia artificial puede ayudar a organizar artículos, comparar hallazgos, sugerir búsquedas, preparar borradores y revisar la claridad de un texto. No reemplaza la lectura de documentos originales ni la responsabilidad del equipo.</p><p>Puede generar referencias inexistentes, interpretar incorrectamente un resultado o afirmar como demostrado lo que no se ha comprobado. Por eso los resultados son <strong>insumos para revisar</strong>, no pruebas automáticas.</p><div class="callout warn"><strong>Ejemplo ficticio de respuesta incorrecta:</strong> «Un estudio de 2026 demuestra que el 82 % de las cafeterías de Sahagún presenta demoras». Sin autor, documento, método ni verificación, no se puede incorporar como hecho.</div><h3>Declaración orientativa</h3><blockquote>Durante la elaboración del planteamiento del problema se utilizó [herramienta] como apoyo para [actividad realizada]. El equipo verificó las fuentes bibliográficas y asumió la responsabilidad por la selección, interpretación y redacción final de la información.</blockquote><p class="note">No compartas datos personales, información empresarial confidencial ni documentos restringidos en servicios públicos sin autorización. Consulta las directrices institucionales vigentes para declarar usos de IA.</p>`,
 activity:{type:'prompts',title:'Cuatro herramientas de trabajo',hint:'Copia el prompt adecuado y úsalo con documentos autorizados. Comprueba siempre el resultado.'},
 note:'Describe para qué utilizarías IA en tu investigación y qué verificaciones realizarías antes de aceptar una respuesta.',
 teacher:'Explica que un texto bien redactado no es evidencia. Pide a los equipos que señalen cómo comprobarían una referencia sugerida por IA.'
},
{
 id:18,station:4,minutes:'25–40 min',title:'Comité de revisión: defiende tu problema',sub:'Un borrador no está listo por tener siete párrafos: debe sostenerse con evidencia.',
 guide:'¿Podrías defender cada afirmación, tu GAP y tu pregunta ante un comité?',carry:'Expediente preliminar, autoevaluación y cuatro argumentos para la defensa.',
 lesson:`<p class="lead">Llegaste al comité de revisión. Ahora integra los hallazgos, fuentes, decisiones y textos producidos durante la experiencia.</p><p><strong>Tu objetivo:</strong> presentar un planteamiento preliminar con una pregunta clara, delimitada y viable; no llenar espacios sin evidencia.</p><div class="step-list"><div class="step"><span class="step-num">1</span><div><strong>Redacta los siete componentes</strong><p>Utiliza fuentes que hayas identificado y revisado. Señala [EVIDENCIA PENDIENTE] donde todavía falte respaldo.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Revisa los diez criterios</strong><p>Distingue qué cumple, qué requiere revisión y qué evidencia falta.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>Prepara tu defensa</strong><p>Explica el fenómeno, la evidencia, el GAP y la viabilidad de la pregunta.</p></div></div></div><div class="callout info">El caso de cafeterías es un modelo de formulación, no la demostración de demoras o mala atención reales en Sahagún. La revisión automática no puede aprobar la calidad científica de un texto libre.</div>`,
 activity:{type:'final',title:'Mi expediente de investigación',hint:'El borrador, las fuentes y la autoevaluación se guardan localmente en este navegador. Descarga una copia para no depender de este equipo.'},
 teacher:'Organiza una sustentación breve. Pide que otros equipos identifiquen afirmaciones sin sustento. No avances a objetivos solo porque completen siete párrafos; revisa pertinencia, claridad y respaldo.'
}
];
const CRITERIA=[
 'El fenómeno está claramente definido.',
 'Las afirmaciones importantes tienen evidencia y fuentes verificables.',
 'Los antecedentes se comparan y no se presentan como resúmenes aislados.',
 'El GAP está sustentado y no se ha inventado.',
 'La evidencia local se diferencia de la información pendiente.',
 'El problema está delimitado y es razonablemente viable.',
 'Cada párrafo cumple un propósito y conecta con el siguiente.',
 'La pregunta se desprende del planteamiento.',
 'Las citas y referencias cumplen APA 7.',
 'El equipo puede explicar y defender con sus palabras lo que escribió.'
];
const DEFENSE=[
 ['¿Cuál es exactamente el fenómeno que vas a investigar?','Identifica el objeto de estudio sin recurrir a un tema demasiado amplio.'],
 ['¿Qué evidencia respalda la necesidad de investigarlo?','Señala fuentes concretas y qué información continúa pendiente.'],
 ['¿Cuál es el GAP y cómo lo identificaste?','Conecta la brecha con antecedentes reales y sus limitaciones.'],
 ['¿Por qué tu pregunta es viable y pertinente?','Indica población, contexto, información requerida y acceso posible.']
];
const KEY='aulaescena_semillero_evidencias_v1';
const defaults=()=>({visited:[],quizzes:{},matches:{},orders:{},notes:{},builder:{fenomeno:'',poblacion:'',territorio:'',periodo:'',pregunta:''},sources:[],drafts:Array(7).fill(''),criteria:{},defense:Array(4).fill(''),labTimes:[3,6,8,12],finalTab:'texto'});
let state=defaults(),route='home',editingSource=null,toastTimer=null,storageOK=true;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);state={...defaults(),...d};state.visited=Array.isArray(d.visited)?d.visited.filter(n=>Number.isInteger(n)&&n>=1&&n<=18):[];state.sources=Array.isArray(d.sources)?d.sources.slice(0,200):[];state.drafts=Array.isArray(d.drafts)?Array.from({length:7},(_,i)=>String(d.drafts[i]||'')):Array(7).fill('');state.defense=Array.isArray(d.defense)?Array.from({length:4},(_,i)=>String(d.defense[i]||'')):Array(4).fill('');state.labTimes=Array.isArray(d.labTimes)&&d.labTimes.length===4?d.labTimes:[3,6,8,12];}}catch(e){storageOK=false;state=defaults();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
function escapeH(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cleanText(v){return String(v??'').trim();}
function words(v){return cleanText(v).split(/\s+/).filter(Boolean).length;}
function notify(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),4200);}
function renderNav(){const s=document.getElementById('sidebarNav');s.innerHTML=`<button type="button" class="navlink ${route==='home'?'active':''}" data-goto="home"><span class="num">⌂</span> Inicio y estaciones</button>`+STATIONS.map(st=>`<div class="station-label">Estación ${st.id} · ${st.short}</div>${SCENES.filter(sc=>sc.station===st.id).map(sc=>`<button type="button" class="navlink ${route===sc.id?'active':''}" data-goto="${sc.id}" ${route===sc.id?'aria-current="page"':''}><span class="num">${String(sc.id).padStart(2,'0')}</span><span>${escapeH(sc.title)}</span><span class="nav-status ${state.visited.includes(sc.id)?'seen':''}" title="${state.visited.includes(sc.id)?'Explorada':'Sin explorar'}"></span></button>`).join('')}`).join('')+`<div class="station-label">Mi trabajo</div><button class="navlink ${route==='data'?'active':''}" type="button" data-goto="data"><span class="num">↧</span> Guardar y recuperar</button>`;
 document.getElementById('sidebarProgressText').textContent=`${state.visited.length} / 18`;
 document.getElementById('sidebarFill').style.width=`${state.visited.length/18*100}%`;
}
function closeDrawer(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');document.getElementById('menuBtn').setAttribute('aria-expanded','false');}
function navigate(dest){if(dest!=='home'&&dest!=='data'){dest=Number(dest);if(!Number.isInteger(dest)||dest<1||dest>18)return;route=dest;if(!state.visited.includes(dest)){state.visited.push(dest);state.visited.sort((a,b)=>a-b);save();}}else route=dest;render();closeDrawer();window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(()=>document.querySelector('#view h1')?.focus({preventScroll:true}));}
function render(){renderNav();const v=document.getElementById('view');document.getElementById('topKicker').textContent=route==='home'?'SEMILLERO DE INVESTIGACIÓN':route==='data'?'HERRAMIENTAS DEL EXPEDIENTE':`ESTACIÓN ${SCENES[route-1].station} · ESCENA ${String(route).padStart(2,'0')} / 18`;
 document.getElementById('topTitle').textContent=route==='home'?'Laboratorio de Evidencias':route==='data'?'Conservar mi trabajo':SCENES[route-1].title;
 v.innerHTML=route==='home'?homeHTML():route==='data'?dataHTML():sceneHTML(SCENES[route-1]);document.title=`${route==='home'?'Laboratorio de Evidencias':route==='data'?'Conservar mi trabajo':SCENES[route-1].title} | AulaEscena · Mg. Vicky Ruiz`;
}
function homeHTML(){return `<section class="hero" aria-labelledby="homeTitle"><div class="hero-copy"><div class="overline">Capítulo 3 · Semillero de Investigación</div><h1 id="homeTitle" tabindex="-1">LABORATORIO<br>DE <em>EVIDENCIAS</em></h1><p>De los 20 artículos científicos a una pregunta de investigación clara, delimitada y defendible. Una experiencia para leer, comparar, escribir y comprobar.</p><div class="home-action-row"><button type="button" class="btn gold" data-goto="${state.visited.length?(SCENES.find(s=>!state.visited.includes(s.id))?.id||18):1}">${state.visited.length?'Continuar recorrido':'Comenzar experiencia'} &nbsp;→</button><button type="button" class="btn outline" data-goto="18">Abrir mi expediente</button></div><div class="meta-strip"><span><i class="dot"></i> 18 escenas</span><span><i class="dot"></i> 4 estaciones</span><span><i class="dot"></i> Ingeniería Industrial</span></div></div><div class="hero-art" aria-hidden="true"><div class="orb"></div><div class="orb two"></div><div class="paper"><div class="p-title">EXPEDIENTE<br>DE INVESTIGACIÓN</div><div class="p-line"></div><div class="p-line"></div><div class="p-line"></div><div class="p-stamp">EN REVISIÓN</div></div></div></section>
<div class="section-heading"><div><div class="overline">Tu recorrido</div><h2>Cuatro estaciones, un problema que defender</h2><p>Explora en orden o accede a una escena desde el índice.</p></div><span class="tag">${state.visited.length} de 18 exploradas</span></div><div class="station-grid">${STATIONS.map(st=>`<button class="station-card" type="button" data-goto="${SCENES.find(s=>s.station===st.id).id}"><div class="k">ESTACIÓN ${String(st.id).padStart(2,'0')} · ESCENAS ${st.range}</div><div><h3>${escapeH(st.title)}</h3><p>${escapeH(st.description)}</p></div><div class="bottom"><span>Abrir estación</span><span aria-hidden="true">↗</span></div></button>`).join('')}</div><div class="home-note"><h3>Antes de comenzar</h3><p>El caso sobre cafeterías de Sahagún es <strong>ilustrativo</strong>, no un diagnóstico del municipio. Los ejercicios de selección y clasificación ofrecen retroalimentación; los textos libres requieren revisión académica. Tu trabajo se intenta guardar en este navegador, pero debes <strong>descargar un respaldo</strong>, especialmente si usas equipos compartidos.</p></div><div class="site-footer">Semillero de Investigación · Capítulo 3 &nbsp; | &nbsp; <strong>Mg. Vicky Ruiz</strong></div>`;}
function sceneHTML(sc){const st=STATIONS[sc.station-1];return `<div class="crumbs"><button type="button" class="btn ghost small" data-goto="home">Inicio</button><span class="sep">/</span>Estación ${st.id}: ${escapeH(st.title)} <span class="sep">/</span> Escena ${String(sc.id).padStart(2,'0')}</div><section class="scene-header"><div class="overline">${escapeH(st.title)} &nbsp; · &nbsp; ${escapeH(sc.minutes)}</div><h1 tabindex="-1">${escapeH(sc.title)}</h1><p class="subtitle">${escapeH(sc.sub)}</p></section><div class="scene-layout"><div class="scene-primary"><article class="panel"><div class="little-heading">Comprende y analiza</div>${sc.lesson}</article><section class="panel" aria-label="Actividad de aprendizaje"><div class="little-heading">Aprende haciendo</div>${renderActivity(sc)}</section>${sc.note?renderNote(sc):''}<details class="teacher-notes"><summary>Orientaciones para la docente · abrir guía</summary><p>${escapeH(sc.teacher)}</p></details></div><aside class="right-sticky"><section class="panel soft"><div class="little-heading">Pregunta orientadora</div><p style="font-weight:700;color:var(--navy)">${escapeH(sc.guide)}</p><div class="divider"></div><div class="little-heading">Qué llevar al expediente</div><p>${escapeH(sc.carry)}</p></section><section class="panel"><div class="little-heading">Tu recorrido</div><div class="row between"><span class="micro">Escena ${sc.id} de 18</span><strong style="color:var(--petrol);font-size:12px">${state.visited.length}/18 exploradas</strong></div><div class="progress-mini" aria-hidden="true"><span style="width:${state.visited.length/18*100}%"></span></div><p class="note" style="margin-top:12px">Puedes volver a cualquier escena. Las respuestas cerradas se comprueban aquí; las respuestas abiertas no reciben una aprobación automática.</p><button class="btn outline small" type="button" data-goto="18">Abrir expediente ↗</button></section></aside></div><footer class="scene-footer"><div class="signature">Mg. Vicky Ruiz</div><div class="footnav"><button type="button" class="btn outline" data-goto="${sc.id===1?'home':sc.id-1}">← Anterior</button><button type="button" class="btn ${sc.id===18?'gold':''}" data-goto="${sc.id===18?'home':sc.id+1}">${sc.id===18?'Volver al inicio':'Siguiente →'}</button></div></footer><div class="footnote">Los casos simulados son de aprendizaje y no describen hallazgos reales en Sahagún. Progreso = escenas exploradas, no calificación.</div>`;}
function renderNote(sc){const val=state.notes[sc.id]||'';return `<section class="panel"><div class="little-heading">Mi bitácora investigativa</div><h2>Escribe y reflexiona</h2><p>${escapeH(sc.note)}</p><label class="sr-only" for="note-${sc.id}">Tu respuesta escrita</label><textarea class="textarea" id="note-${sc.id}" data-note="${sc.id}" placeholder="Escribe aquí tus ideas, las fuentes que necesitarás y los ajustes de tu proyecto...">${escapeH(val)}</textarea><div class="row between"><span class="word-count" id="note-count-${sc.id}">${words(val)} palabras</span><span class="micro">Se guarda en este navegador; exporta un respaldo.</span></div></section>`;}
function renderActivity(sc){const a=sc.activity;switch(a.type){case 'quiz':return quizHTML(sc.id,a);case 'match':return matchHTML(sc.id,a);case 'order':return orderHTML(sc.id,a);case 'builder':return builderHTML();case 'sources':return sourcesHTML();case 'lab':return labHTML();case 'prompts':return promptsHTML();case 'final':return finalHTML();default:return ''}}
function quizHTML(id,a){const current=state.quizzes[id]||{};return `<div class="quiz-box" data-widget="quiz-${id}"><div class="quiz-label">Decisión investigativa · ${String(id).padStart(2,'0')}</div><h3>${escapeH(a.title)}</h3><p>${escapeH(a.question)}</p>${a.options.map((opt,i)=>`<label class="quiz-option"><input type="radio" name="quiz-${id}" value="${i}" ${current.choice===i?'checked':''}><span>${escapeH(opt)}</span></label>`).join('')}<div class="quiz-actions"><button type="button" class="btn" data-action="check-quiz" data-id="${id}">Comprobar respuesta</button><button type="button" class="btn outline" data-action="hint" data-id="${id}">Necesito una pista</button></div><div class="feedback ${current.correct?'':'bad'}" id="quiz-feedback-${id}" ${current.choice===undefined?'hidden':''}>${current.choice===undefined?'':escapeH(current.correct?a.why:a.wrong)}</div><div id="quiz-hint-${id}" class="hintbox hidden">${escapeH(a.hint)}</div></div>`;}
function matchHTML(id,a){const previous=state.matches[id]||{};return `<div class="practice"><h3>${escapeH(a.title)}</h3>${a.intro?`<p>${escapeH(a.intro)}</p>`:''}<div>${a.rows.map((r,i)=>`<div class="matching-row"><div><strong>${i+1}.</strong> ${escapeH(r[0])}</div><div><label class="sr-only" for="match-${id}-${i}">Clasificación para ejemplo ${i+1}</label><select class="select" id="match-${id}-${i}" data-match="${id}" data-index="${i}"><option value="">Selecciona una categoría</option>${a.options.map((opt,j)=>`<option value="${j}" ${String(previous[i])===String(j)?'selected':''}>${escapeH(opt)}</option>`).join('')}</select></div></div>`).join('')}</div><div class="quiz-actions"><button class="btn" type="button" data-action="check-match" data-id="${id}">Comprobar clasificación</button><button class="btn outline" type="button" data-action="hint" data-id="${id}">Necesito una pista</button></div><div id="match-feedback-${id}" aria-live="polite"></div><div id="match-hint-${id}" class="hintbox hidden">${escapeH(a.hint)}</div></div>`;}
function orderHTML(id,a){const current=state.orders[id]||{};return `<div class="practice"><h3>${escapeH(a.title)}</h3><p>${escapeH(a.intro)}</p>${a.items.map((it,i)=>`<div class="matching-row"><span>${escapeH(it[0])}</span><div><label class="sr-only" for="order-${id}-${i}">Posición del elemento ${i+1}</label><select class="select" id="order-${id}-${i}"><option value="">Elegir lugar</option>${[1,2,3].map(j=>`<option value="${j}" ${String(current[i])===String(j)?'selected':''}>Lugar ${j}</option>`).join('')}</select></div></div>`).join('')}<div class="quiz-actions"><button class="btn" type="button" data-action="check-order" data-id="${id}">Comprobar secuencia</button><button class="btn outline" type="button" data-action="hint" data-id="${id}">Necesito una pista</button></div><div id="order-feedback-${id}" aria-live="polite"></div><div id="order-hint-${id}" class="hintbox hidden">${escapeH(a.hint)}</div></div>`;}
function builderHTML(){const v=state.builder;const f=[['fenomeno','Fenómeno o relación','Ej. relación entre tiempos de espera y percepción del servicio'],['poblacion','Población o unidades de estudio','Ej. clientes de cafeterías participantes'],['territorio','Territorio o contexto','Ej. área urbana de Sahagún'],['periodo','Periodo previsto','Ej. primer semestre de 2027']];return `<div class="practice"><h3>Tu pregunta preliminar</h3><p>Completa los cuatro campos. La frase sugerida es un punto de partida que debes revisar, no una pregunta aprobada automáticamente.</p>${f.map(x=>`<div class="field"><label for="builder-${x[0]}">${x[1]}</label><input class="input" type="text" id="builder-${x[0]}" data-builder="${x[0]}" maxlength="350" placeholder="${x[2]}" value="${escapeH(v[x[0]])}"></div>`).join('')}<div class="field"><label for="builder-pregunta">Mi redacción de la pregunta (puedes corregir la sugerencia)</label><textarea class="textarea smallarea" id="builder-pregunta" data-builder="pregunta" placeholder="Ej. ¿Qué relación existe entre ...?">${escapeH(v.pregunta||'')}</textarea></div><div id="builder-preview" class="callout info" role="status"></div><button class="btn outline" data-action="copy-question" type="button">Copiar pregunta provisional</button></div>`;}
function buildQuestion(){const b=state.builder;if(cleanText(b.pregunta))return cleanText(b.pregunta);const any=['fenomeno','poblacion','territorio','periodo'].some(k=>cleanText(b[k]));if(!any)return '';return `¿Qué puede establecerse acerca de ${cleanText(b.fenomeno)||'[fenómeno]'} en ${cleanText(b.poblacion)||'[población]'} del contexto de ${cleanText(b.territorio)||'[territorio]'} durante ${cleanText(b.periodo)||'[periodo]'}?`;}

function updateBuilder(){const e=document.getElementById('builder-preview');if(!e)return;const q=buildQuestion();e.innerHTML=q?`<strong>${cleanText(state.builder.pregunta)?'Tu redacción preliminar:':'Propuesta generada para revisar:'}</strong><br>${escapeH(q)}<p class="note" style="margin-top:8px">Corrige la redacción y comprueba que la pregunta se pueda responder con la evidencia y el método previstos. Para una pregunta de relación entre variables puede ser más preciso preguntar: «¿Qué relación existe entre ...?».</p>`:'Completa los campos para visualizar un borrador de pregunta.';}
const EXTRA_QUIZZES={
16:{title:'¿Qué concluyen estas observaciones?',question:'Al observar cuatro tiempos ficticios, ¿qué afirmación puede respaldarse con la información obtenida?',options:['Todas las cafeterías de Sahagún tienen demoras graves.','En el ejercicio simulado, únicamente podemos describir los tiempos de las cuatro observaciones registradas.','Los tiempos de espera causaron insatisfacción en los clientes.'],correct:1,why:'Los datos permiten describir las cuatro observaciones ficticias mostradas. No permiten generalizar ni establecer efectos sobre satisfacción.',wrong:'Una medición de tiempo no describe una población entera ni demuestra por sí sola causas de insatisfacción.',hint:'¿Qué alternativa describe exclusivamente los cuatro datos del ejercicio, sin agregar población ni causas?'},
17:{title:'¿Confiarías en una cifra generada por IA?',question:'La IA afirma que el 82 % de las cafeterías locales tiene problemas de atención y no muestra fuente. ¿Qué haces?',options:['La citas porque el número es preciso.','Buscas la fuente original, su método, población y resultado; si no se verifica, no la usas como hecho.','La utilizas si otra herramienta de IA repite la cifra.'],correct:1,why:'Corresponde comprobar la existencia del documento, su metodología y que efectivamente respalde la afirmación.',wrong:'La aparente precisión y la repetición de una cifra por herramientas no sustituyen la verificación de fuentes.',hint:'¿Qué harías si un jurado te pidiera mostrar el documento de donde salió ese porcentaje?'}
};
function roleCheckBoxes(roles=[]){return PARAS.map((p,i)=>`<label class="checkbox-row"><input type="checkbox" class="role-check" value="${i}" ${roles.includes(i)?'checked':''}> Párrafo ${i+1} · ${escapeH(p[0])}</label>`).join('');}
function sourceEditor(source){source=source||{};return `<form id="sourceForm" class="practice" novalidate><h3>${editingSource?'Editar fuente':'Registrar una fuente de la matriz'}</h3><p class="note">El registro no valida automáticamente la existencia o pertinencia de un artículo. Comprueba el documento original.</p><div class="field"><label for="src-ref">Referencia bibliográfica o autores y año *</label><textarea class="textarea smallarea" id="src-ref" maxlength="1500" placeholder="Referencia APA completa, si está disponible">${escapeH(source.ref||'')}</textarea></div><div class="field"><label for="src-title">Título del artículo</label><input class="input" id="src-title" maxlength="500" value="${escapeH(source.title||'')}" placeholder="Título exacto de la publicación"></div><div class="field"><label for="src-finding">Hallazgo principal o aporte pertinente *</label><textarea class="textarea smallarea" id="src-finding" maxlength="4000" placeholder="¿Qué concluye realmente el estudio?">${escapeH(source.finding||'')}</textarea></div><div class="grid-two"><div class="field"><label for="src-context">Población y contexto</label><textarea class="textarea smallarea" id="src-context" maxlength="1500" placeholder="¿Dónde y a quiénes estudió?">${escapeH(source.context||'')}</textarea></div><div class="field"><label for="src-limit">Limitaciones o información pendiente</label><textarea class="textarea smallarea" id="src-limit" maxlength="1500" placeholder="¿Qué no permite concluir?">${escapeH(source.limit||'')}</textarea></div></div><div class="field"><label for="src-method">Metodología / instrumento (opcional)</label><input class="input" id="src-method" maxlength="1000" value="${escapeH(source.method||'')}" placeholder="Método o tipo de estudio"></div><div class="little-heading">¿A qué párrafo puede aportar? (elige uno o varios)</div><div class="grid-two">${roleCheckBoxes(source.roles||[])}</div><label class="checkbox-row" style="margin-top:14px"><input type="checkbox" id="src-verified" ${source.verified?'checked':''}> He consultado el documento original y revisado este registro.</label><div class="quiz-actions"><button type="submit" class="btn">${editingSource?'Guardar cambios':'Añadir al expediente'}</button>${editingSource?'<button type="button" class="btn outline" data-action="cancel-source">Cancelar edición</button>':''}</div><div id="source-error" role="alert" class="feedback bad" hidden></div></form>`;}
function sourceCards(){if(!state.sources.length)return `<div class="callout">Todavía no hay fuentes registradas. Comienza por un artículo de tu matriz. También puedes importar un CSV desde este taller.</div>`;return `<p class="note">${state.sources.length} fuente(s) registradas. La marca «revisada» indica tu declaración, no una validación automática.</p>${state.sources.map(s=>`<article class="source-card"><div class="row between"><span class="smallcaps">${s.verified?'Original consultado (declarado)':'Original por comprobar'}</span><span class="tag">${(s.roles||[]).length} uso(s)</span></div><h4>${escapeH(s.title||s.ref||'Sin título')}</h4><p><strong>Referencia:</strong> ${escapeH(s.ref||'EVIDENCIA PENDIENTE')}</p><p><strong>Hallazgo:</strong> ${escapeH(s.finding||'EVIDENCIA PENDIENTE')}</p>${s.context?`<p><strong>Contexto:</strong> ${escapeH(s.context)}</p>`:''}${s.limit?`<p><strong>Límites:</strong> ${escapeH(s.limit)}</p>`:''}<div>${(s.roles||[]).map(i=>`<span class="source-role">P${i+1}: ${escapeH(PARAS[i]?.[0]||'')}</span>`).join('')||'<span class="micro">No asociada todavía a un párrafo</span>'}</div><div class="buttons"><button type="button" class="btn outline small" data-action="edit-source" data-id="${escapeH(s.id)}">Editar</button><button type="button" class="btn outline small" data-action="delete-source" data-id="${escapeH(s.id)}">Eliminar</button></div></article>`).join('')}`;}
function sourcesHTML(){const editing=state.sources.find(s=>s.id===editingSource);return `<h2>Organiza tu evidencia</h2><p>Relaciona las fuentes de tu matriz con el planteamiento. La misma investigación puede apoyar más de un párrafo si su contenido lo justifica.</p><div class="row"><button type="button" class="btn outline small" data-action="open-csv">↑ Importar archivo CSV</button><button type="button" class="btn outline small" data-action="csv-template">↓ Plantilla CSV</button></div><p class="note">Para importar desde Excel, guarda una copia de la hoja en formato CSV (UTF-8). La aplicación reconoce encabezados habituales de la matriz; verifica cada registro importado.</p><div id="source-editor-area">${sourceEditor(editing)}</div><div class="divider"></div><h3 id="source-count-title">Biblioteca registrada (${state.sources.length})</h3><div id="source-list">${sourceCards()}</div>`;}
function labHTML(){const vals=state.labTimes.map(v=>Number(v));const avg=vals.reduce((s,v)=>s+v,0)/4;const min=Math.min(...vals),max=Math.max(...vals);return `<h2>Mide antes de afirmar</h2><p>Modifica los cuatro tiempos ficticios, expresados en minutos, para ver cómo cambian los resultados descriptivos. Cada valor debe estar entre 0 y 240 minutos.</p><div class="measure-inputs">${vals.map((v,i)=>`<div class="field"><label for="time-${i}">Observación ${i+1} · min</label><input class="input" data-time="${i}" type="number" id="time-${i}" min="0" max="240" step="0.5" value="${Number.isFinite(v)?v:0}"></div>`).join('')}</div><div id="measureError" class="feedback bad" hidden></div><div class="lab-summary" id="labSummary"><div class="lab-stat"><strong>${fmt(avg)}</strong><span>Media de las 4 observaciones · min</span></div><div class="lab-stat"><strong>${fmt(min)}</strong><span>Mínimo · min</span></div><div class="lab-stat"><strong>${fmt(max)}</strong><span>Máximo · min</span></div></div><div class="bar-grid" id="barGrid" role="img" aria-label="Gráfico de barras de cuatro tiempos de espera ficticios">${vals.map((v,i)=>`<div class="barcol"><strong>${fmt(v)} min</strong><div class="bar" style="height:${Math.max(2,(v/Math.max(1,max))*150)}px"></div><span>Obs. ${i+1}</span></div>`).join('')}</div><p class="note">Datos inventados para practicar; no representan mediciones de cafeterías reales. Media = suma de tiempos / 4. Los resultados describen únicamente estas observaciones.</p>${quizHTML(16,EXTRA_QUIZZES[16])}<div class="callout warn"><strong>Antes de recoger información real:</strong> define cuándo comienza y termina el tiempo de espera, las condiciones de medición, las autorizaciones y cómo protegerás los datos de las personas participantes.</div>`;}
function fmt(n){return Number(n).toLocaleString('es-CO',{maximumFractionDigits:2});}
function promptsHTML(){return `<h2>Elige la tarea adecuada</h2><p>Estos cuatro prompts proceden del anexo del capítulo, con campos que debes completar de acuerdo con tu proyecto. No funcionan como un chat dentro de esta aplicación; se copian para usarlos en una herramienta autorizada.</p>${PROMPTS.map((p,i)=>`<details class="prompt-card" ${i===0?'open':''}><summary><strong>${escapeH(p.title)}</strong><br><span class="micro">${escapeH(p.goal)}</span></summary><pre>${escapeH(p.text)}</pre><button type="button" class="btn outline small" data-action="copy-prompt" data-id="${i}">Copiar este prompt</button></details>`).join('')}${quizHTML(17,EXTRA_QUIZZES[17])}<div class="drawer-footer">Conserva el registro de herramientas y prompts utilizados. No entregues a servicios públicos información personal o empresarial restringida sin autorización.</div>`;}

function evidencePane(){return `<h3>Fuentes vinculadas</h3><p>Este panel consulta las fuentes registradas en la escena 14. Si necesitas editarlas, utiliza el taller bibliográfico.</p><button class="btn outline" type="button" data-goto="14">Editar mi mesa bibliográfica →</button>${sourceCards()}<div class="callout warn">Registrar una referencia o marcarla como «consultada» no significa que una herramienta haya comprobado la fuente. Corresponde al equipo contrastarla con el original.</div>`;}
function committeePane(){const all=Object.values(state.criteria);const done=all.filter(v=>v==='cumple').length;const rev=all.filter(v=>v==='revisar').length;const pending=all.filter(v=>v==='pendiente').length;return `<h3>Diez criterios del semillero</h3><p>Declara cómo valoras cada criterio. Estas marcas sirven para autoevaluarte: no son un resultado certificado ni una calificación.</p><div class="lab-summary"><div class="lab-stat"><strong>${done}</strong><span>Declaro que cumple</span></div><div class="lab-stat"><strong>${rev}</strong><span>Necesita revisión</span></div><div class="lab-stat"><strong>${pending}</strong><span>Evidencia pendiente</span></div></div>${CRITERIA.map((c,i)=>`<div class="checkline"><div><strong>${i+1}.</strong> ${escapeH(c)}</div><label class="sr-only" for="criterion-${i}">Estado del criterio ${i+1}</label><select class="select" id="criterion-${i}" data-criterion="${i}"><option value="" ${!state.criteria[i]?'selected':''}>Sin evaluar</option><option value="cumple" ${state.criteria[i]==='cumple'?'selected':''}>Declaro que cumple</option><option value="revisar" ${state.criteria[i]==='revisar'?'selected':''}>Necesita revisión</option><option value="pendiente" ${state.criteria[i]==='pendiente'?'selected':''}>Evidencia pendiente</option></select></div>`).join('')}<h3>Defiende tu problema en cuatro respuestas</h3>${DEFENSE.map((d,i)=>`<div class="editor-block"><h3>${i+1}. ${escapeH(d[0])}</h3><p>${escapeH(d[1])}</p><label class="sr-only" for="defense-${i}">Respuesta de defensa ${i+1}</label><textarea class="textarea smallarea" id="defense-${i}" data-defense="${i}" placeholder="Explica tu decisión con tus propias palabras...">${escapeH(state.defense[i])}</textarea></div>`).join('')}<div class="callout info"><strong>Criterio final.</strong> No avanzaremos a los objetivos solo porque hayamos escrito siete párrafos. El problema debe ser claro, pertinente y razonablemente sustentado.</div>`;}
function finalHTML(){const tab=state.finalTab||'texto';return `<div class="tabs" role="tablist" aria-label="Secciones del expediente"><button role="tab" type="button" class="tab" aria-selected="${tab==='texto'}" data-action="final-tab" data-id="texto">Mi planteamiento</button><button role="tab" type="button" class="tab" aria-selected="${tab==='fuentes'}" data-action="final-tab" data-id="fuentes">Mi evidencia</button><button role="tab" type="button" class="tab" aria-selected="${tab==='revision'}" data-action="final-tab" data-id="revision">Comité de revisión</button></div><div id="finalTabPane" role="tabpanel">${tab==='texto'?draftPane():tab==='fuentes'?evidencePane():committeePane()}</div><div class="quiz-actions"><button class="btn gold" type="button" data-action="report-html">↓ Informe imprimible</button><button class="btn outline" type="button" data-action="export-md">↓ Texto (.md)</button><button class="btn outline" type="button" data-goto="data">Guardar respaldo JSON</button></div>`;}
function dataHTML(){return `<div class="crumbs"><button class="btn ghost small" data-goto="home">Inicio</button><span class="sep">/</span> Guardar y recuperar</div><section class="scene-header"><div class="overline">Tu trabajo académico</div><h1 tabindex="-1">Conserva tu expediente</h1><p class="subtitle">El HTML funciona sin servidor. Tu texto no se envía automáticamente a la docente ni a una base de datos.</p></section><div class="scene-layout"><div><section class="panel"><div class="little-heading">Exportación</div><h2>Descarga tu trabajo</h2><p>El informe HTML incluye tu planteamiento, fuentes y revisión en una página imprimible que puedes abrir en el navegador y guardar como PDF. El expediente Markdown contiene además la bitácora; puedes abrirlo como texto o copiarlo a Word.</p><div class="quiz-actions"><button type="button" class="btn gold" data-action="report-html">↓ Informe imprimible (.html)</button><button type="button" class="btn outline" data-action="export-md">↓ Expediente (.md)</button><button type="button" class="btn outline" data-action="backup">↓ Respaldo (.json)</button><button type="button" class="btn outline" data-action="print">Imprimir vista</button></div><div class="divider"></div><h3>Recuperar un respaldo</h3><p>Importa el archivo JSON exportado por esta misma aplicación. <strong>Esta acción reemplazará los datos actuales</strong> después de tu confirmación.</p><button class="btn outline" type="button" data-action="restore">↑ Importar respaldo (.json)</button><div class="divider"></div><h3>Reiniciar el recorrido</h3><p>La eliminación afecta los datos de esta aplicación en este navegador. Antes descarga una copia si deseas conservarlos.</p><button class="btn outline" type="button" data-action="reset">Restablecer todos mis datos</button></section></div><aside><section class="panel soft"><div class="little-heading">Estado de trabajo</div><h2>${state.visited.length} / 18</h2><p>Escenas exploradas</p><div class="progress-mini"><span style="width:$
