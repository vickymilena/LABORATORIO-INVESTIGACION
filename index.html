function currentQuiz(id){return SCENES[id-1]?.activity?.type==='quiz'?SCENES[id-1].activity:EXTRA_QUIZZES[id];}
function feedback(container,good,title,explanation){if(!container)return;container.hidden=false;container.className=`feedback ${good?'':'bad'}`;container.innerHTML=`<strong>${escapeH(title)}</strong><br>${escapeH(explanation)}`;}
function checkQuiz(id){const a=currentQuiz(id),root=document.querySelector(`[data-widget="quiz-${id}"]`);if(!a||!root)return;const chosen=root.querySelector(`input[name="quiz-${id}"]:checked`);const f=document.getElementById(`quiz-feedback-${id}`);if(!chosen){feedback(f,false,'Selecciona una opción.','Elige una alternativa antes de comprobar.');return;}const choice=Number(chosen.value),correct=choice===a.correct;state.quizzes[id]={choice,correct};save();feedback(f,correct,correct?'Decisión adecuada':'Necesita revisión',correct?a.why:a.wrong);}
function checkMatch(id){const a=SCENES[id-1].activity,entries=a.rows.map((r,i)=>document.getElementById(`match-${id}-${i}`).value),f=document.getElementById(`match-feedback-${id}`);if(entries.some(v=>v==='')){f.innerHTML='<div class="feedback warn">Clasifica todas las fichas antes de comprobar.</div>';return;}state.matches[id]=Object.fromEntries(entries.map((v,i)=>[i,Number(v)]));save();const count=entries.filter((v,i)=>Number(v)===a.rows[i][1]).length,all=count===entries.length;f.innerHTML=`<div class="feedback ${all?'':'bad'}"><strong>${count} de ${entries.length} decisiones adecuadas.</strong><br>${all?'Buena clasificación.':'Revisa las clasificaciones que no corresponden.'}</div><div class="indented">${a.rows.map((r,i)=>`<p class="note"><strong>Ficha ${i+1}:</strong> ${Number(entries[i])===r[1]?'Correcto. ':'Revisar: '} ${escapeH(r[2])}</p>`).join('')}</div>`;}
function checkOrder(id){const a=SCENES[id-1].activity,vals=a.items.map((_,i)=>document.getElementById(`order-${id}-${i}`).value),f=document.getElementById(`order-feedback-${id}`);if(vals.some(v=>v==='')){f.innerHTML='<div class="feedback warn">Asigna un lugar a cada elemento.</div>';return;}const all=vals.every((v,i)=>Number(v)===a.items[i][1]);state.orders[id]=Object.fromEntries(vals.map((v,i)=>[i,Number(v)]));save();f.innerHTML=`<div class="feedback ${all?'':'bad'}"><strong>${all?'Secuencia coherente':'Revisa el orden propuesto'}</strong><br>${all?'Primero se identifica lo desconocido, después se justifica el estudio y finalmente se formula la pregunta.':'La ruta esperada es: identificar la incertidumbre → justificar la necesidad → formular la pregunta. Evita asignar el mismo lugar a dos componentes.'}</div>`;}
function showHint(id){['quiz','match','order'].forEach(type=>{const el=document.getElementById(`${type}-hint-${id}`);if(el)el.classList.toggle('hidden');});}
function updateLab(){const el=document.querySelectorAll('input[data-time]'),vals=Array.from(el).map(x=>Number(x.value)),error=document.getElementById('measureError');if(el.length!==4)return;const valid=Array.from(el).every(x=>cleanText(x.value)!==''&&Number.isFinite(Number(x.value))&&Number(x.value)>=0&&Number(x.value)<=240);if(!valid){error.hidden=false;error.textContent='Introduce cuatro valores numéricos entre 0 y 240 minutos para actualizar el simulador.';return;}error.hidden=true;state.labTimes=vals;save();const avg=vals.reduce((x,y)=>x+y,0)/4,mx=Math.max(...vals),mn=Math.min(...vals);document.getElementById('labSummary').innerHTML=`<div class="lab-stat"><strong>${fmt(avg)}</strong><span>Media de las 4 observaciones · min</span></div><div class="lab-stat"><strong>${fmt(mn)}</strong><span>Mínimo · min</span></div><div class="lab-stat"><strong>${fmt(mx)}</strong><span>Máximo · min</span></div>`;document.getElementById('barGrid').innerHTML=vals.map((v,i)=>`<div class="barcol"><strong>${fmt(v)} min</strong><div class="bar" style="height:${Math.max(2,(v/Math.max(1,mx))*150)}px"></div><span>Obs. ${i+1}</span></div>`).join('');document.getElementById('barGrid').setAttribute('aria-label','Cuatro tiempos ficticios en minutos: '+vals.join(', '));}
function refreshSources(){const ed=document.getElementById('source-editor-area'),li=document.getElementById('source-list');if(ed)ed.innerHTML=sourceEditor(state.sources.find(s=>s.id===editingSource));if(li)li.innerHTML=sourceCards();const h=document.getElementById('source-count-title');if(h)h.textContent=`Biblioteca registrada (${state.sources.length})`;}
function addSource(){const f=document.getElementById('sourceForm');if(!f)return;const read=id=>cleanText(document.getElementById(id)?.value);const s={id:editingSource||`src_${Date.now()}_${state.sources.length}`,ref:read('src-ref'),title:read('src-title'),finding:read('src-finding'),context:read('src-context'),limit:read('src-limit'),method:read('src-method'),roles:Array.from(f.querySelectorAll('.role-check:checked')).map(e=>Number(e.value)),verified:document.getElementById('src-verified').checked};const err=document.getElementById('source-error');if(!s.ref||!s.finding){feedback(err,false,'Faltan datos','Registra al menos una referencia o autoría identificable y el hallazgo que deseas utilizar.');return;}if(editingSource){state.sources=state.sources.map(x=>x.id===editingSource?s:x);}else{if(state.sources.length>=200){feedback(err,false,'Límite alcanzado','El máximo local es 200 fuentes. Exporta tu respaldo para conservar más información por separado.');return;}state.sources.push(s);}editingSource=null;save();refreshSources();notify('Fuente registrada en tu expediente.');}
function normalizeStr(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const firstLine=text.split(/\r?\n/,1)[0]||'';const candidates=[',',';','\t'];const counts=candidates.map(d=>(firstLine.match(new RegExp(d==='\t'?'\\t':d,'g'))||[]).length);const delim=candidates[counts.indexOf(Math.max(...counts))]||',';let rows=[],row=[],cell='',inQuotes=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(inQuotes&&text[i+1]==='"'){cell+='"';i++;}else inQuotes=!inQuotes;}else if(ch===delim&&!inQuotes){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!inQuotes){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>cleanText(x)))rows.push(row);row=[];cell='';}else cell+=ch;}row.push(cell);if(row.some(x=>cleanText(x)))rows.push(row);return rows;}
function importCSV(text){const rows=parseCSV(text);if(rows.length<2)throw new Error('El archivo necesita encabezados y al menos una fila.');const headers=rows[0].map(normalizeStr);const find=(...names)=>headers.findIndex(h=>names.some(n=>h===normalizeStr(n)||h.includes(normalizeStr(n))));const at=(r,i)=>i<0?'':cleanText(r[i]);const ix={ref:find('referencia apa','referencia','autores','autor'),title:find('titulo','title'),finding:find('hallazgo principal','hallazgo','resultados','aporte'),context:find('poblacion','contexto','muestra'),limit:find('limitaciones','limitacion','que falta por estudiar','gap'),method:find('metodologia','metodo')};if(ix.ref<0&&ix.title<0)throw new Error('No se reconoció una columna de Referencia, Autor o Título. Utiliza la plantilla CSV.');const imported=[];for(const r of rows.slice(1)){const s={id:`csv_${Date.now()}_${imported.length}`,ref:at(r,ix.ref).slice(0,1500),title:at(r,ix.title).slice(0,500),finding:at(r,ix.finding).slice(0,4000)||'[EVIDENCIA PENDIENTE]',context:at(r,ix.context).slice(0,1500),limit:at(r,ix.limit).slice(0,1500),method:at(r,ix.method).slice(0,1000),roles:[],verified:false};if(!s.ref&&!s.title)continue;if(!s.ref)s.ref=s.title+' [referencia completa pendiente]';imported.push(s);if(state.sources.length+imported.length>=200)break;}if(!imported.length)throw new Error('No se encontraron filas con fuentes reconocibles.');state.sources.push(...imported);save();refreshSources();notify(`${imported.length} fuente(s) importadas. Revisa su contenido y asígnalas a los párrafos.`);}
function downloadBlob(filename,text,mime){const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copia no disponible');}notify('Texto copiado al portapapeles.');}catch(err){notify('No se pudo copiar automáticamente. Selecciona el texto y cópialo manualmente.');}}
function mdExport(){const date=new Date().toLocaleDateString('es-CO'),q=buildQuestion()||'[PREGUNTA PENDIENTE]';let lines=[`# Expediente de investigación — Laboratorio de Evidencias`,'',`Fecha de exportación: ${date}`,'Semillero de Investigación · Ingeniería Industrial','Mg. Vicky Ruiz','','> Autoevaluación y borrador: no equivalen a una aprobación académica.','','## Pregunta preliminar','',q,'','## Planteamiento del problema'];PARAS.forEach((p,i)=>lines.push('',`### ${i+1}. ${p[0]}`,'',state.drafts[i]||'[PÁRRAFO PENDIENTE]'));
 lines.push('','## Fuentes de la matriz','');if(!state.sources.length)lines.push('[FUENTES PENDIENTES]');state.sources.forEach((s,i)=>{lines.push(`### Fuente ${i+1}: ${s.title||'Sin título'}`,'',`Referencia: ${s.ref||'[PENDIENTE]'}`,`Hallazgo: ${s.finding||'[PENDIENTE]'}`,`Contexto: ${s.context||'[PENDIENTE]'}`,`Metodología: ${s.method||'[PENDIENTE]'}`,`Limitaciones: ${s.limit||'[PENDIENTE]'}`,`Usos: ${(s.roles||[]).map(k=>`párrafo ${k+1}`).join(', ')||'[SIN CLASIFICAR]'}`,`Original revisado (declaración personal): ${s.verified?'Sí':'No'}`,'');});lines.push('## Autoevaluación');CRITERIA.forEach((c,i)=>lines.push(`${i+1}. ${c} — ${state.criteria[i]||'sin evaluar'}`));lines.push('','## Defensa');DEFENSE.forEach((d,i)=>lines.push('',`${i+1}. ${d[0]}`,state.defense[i]||'[RESPUESTA PENDIENTE]'));lines.push('','## Bitácora de escenas');Object.keys(state.notes).sort((a,b)=>a-b).forEach(k=>{if(cleanText(state.notes[k]))lines.push('',`### Escena ${k} · ${SCENES[Number(k)-1]?.title||''}`,state.notes[k]);});lines.push('','---','Este material se elaboró con una herramienta educativa local. Verifica toda fuente y afirmación antes de entregar.');downloadBlob('expediente_investigacion.md',lines.join('\n'),'text/markdown;charset=utf-8');notify('Expediente descargado en formato Markdown.');}
function reportHTML(){const paras=PARAS.map((p,i)=>`<section><h2>${i+1}. ${escapeH(p[0])}</h2><p class="writing">${escapeH(state.drafts[i]||'[PÁRRAFO PENDIENTE]')}</p></section>`).join('');const sources=state.sources.length?state.sources.map((s,i)=>`<li><strong>${escapeH(s.ref||s.title)}</strong><p>${escapeH(s.finding||'')}</p>${s.verified?'':'<em>Documento original pendiente de comprobar.</em>'}</li>`).join(''):'<li>[REFERENCIAS PENDIENTES]</li>';const review=CRITERIA.map((c,i)=>`<li>${escapeH(c)} — ${escapeH(state.criteria[i]||'Sin evaluar')}</li>`).join('');const defense=DEFENSE.map((d,i)=>`<h3>${i+1}. ${escapeH(d[0])}</h3><p class="writing">${escapeH(state.defense[i]||'[RESPUESTA PENDIENTE]')}</p>`).join('');const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Expediente de investigación</title><style>body{font-family:Arial,sans-serif;line-height:1.7;color:#202932;max-width:860px;padding:40px;margin:auto}h1,h2,h3{color:#112A46}h1{font-size:25px}h2{font-size:18px;margin-top:28px}h3{font-size:14px}p{font-size:12pt}.writing{white-space:pre-wrap;min-height:20px}li{margin:10px 0}.meta{color:#5b707b;font-size:13px}.warning{padding:12px;border-left:3px solid #D6A84B;background:#fbf5e5}footer{margin-top:40px;border-top:1px solid #ddd;padding-top:12px;color:#112A46;font-size:12px}@media print{body{padding:5mm;margin:0}h2{break-after:avoid}section{break-inside:avoid}}</style></head><body><h1>Expediente del problema de investigación</h1><p class="meta">Semillero de Investigación · Ingeniería Industrial · ${escapeH(new Date().toLocaleDateString('es-CO'))}</p><p class="warning">Documento preliminar. Verifica fuentes, cifras, citas y criterios APA antes de entregar. Las marcas de autoevaluación son declaraciones del equipo.</p><h2>Pregunta preliminar</h2><p>${escapeH(buildQuestion()||'[PREGUNTA PENDIENTE]')}</p><h2>Planteamiento</h2>${paras}<h2>Fuentes registradas</h2><ol>${sources}</ol><h2>Autoevaluación</h2><ol>${review}</ol><h2>Preparación de la de function backup(){downloadBlob('respaldo_aulaescena.json',JSON.stringify({format:'aulaescena-evidencias-1',savedAt:new Date().toISOString(),data:state},null,2),'application/json;charset=utf-8');notify('Respaldo JSON descargado.');}
function sanitizeImport(d){if(!d||typeof d!=='object'||Array.isArray(d))throw Error('El respaldo no contiene datos válidos.');const o=defaults();o.visited=Array.isArray(d.visited)?[...new Set(d.visited.filter(n=>Number.isInteger(n)&&n>=1&&n<=18))]:[];for(const prop of ['notes','builder','quizzes','matches','orders','criteria'])if(d[prop]&&typeof d[prop]==='object'&&!Array.isArray(d[prop]))o[prop]=d[prop];for(const prop of ['drafts','defense']){const len=prop==='drafts'?7:4;o[prop]=Array.from({length:len},(_,i)=>String(d[prop]?.[i]||'').slice(0,40000));}o.sources=Array.isArray(d.sources)?d.sources.slice(0,200).filter(s=>s&&typeof s==='object').map((s,i)=>({id:String(s.id||`restored_${i}`).slice(0,140),ref:String(s.ref||'').slice(0,1500),title:String(s.title||'').slice(0,500),finding:String(s.finding||'').slice(0,4000),context:String(s.context||'').slice(0,1500),limit:String(s.limit||'').slice(0,1500),method:String(s.method||'').slice(0,1000),roles:Array.isArray(s.roles)?s.roles.filter(i=>Number.isInteger(i)&&i>=0&&i<=6):[],verified:!!s.verified})):[];o.labTimes=Array.isArray(d.labTimes)&&d.labTimes.length===4?d.labTimes.map(v=>Number(v)).filter(v=>Number.isFinite(v)&&v>=0&&v<=240):o.labTimes;if(o.labTimes.length!==4)o.labTimes=[3,6,8,12];o.finalTab=['texto','fuentes','revision'].includes(d.finalTab)?d.finalTab:'texto';return o;}
function csvTemplate(){let headers=['Referencia APA','Título','Hallazgo principal','Población y contexto','Metodología','Limitaciones declaradas'];let sample=['Apellido, A. (Año). Título. Revista. DOI','Título de la publicación','Hallazgo verificable del artículo','Población y lugar','Diseño e instrumentos','Límites del estudio'];let csv=[headers,sample].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadBlob('plantilla_matriz_fuentes.csv','\uFEFF'+csv,'text/csv;charset=utf-8');notify('Plantilla CSV descargada.');}
function onAction(btn){const action=btn.dataset.action,id=btn.dataset.id;switch(action){case 'check-quiz':checkQuiz(Number(id));break;case 'check-match':checkMatch(Number(id));break;case 'check-order':checkOrder(Number(id));break;case 'hint':showHint(Number(id));break;case 'copy-question':copyText(buildQuestion()||'Completa primero los campos de la pregunta.');break;case 'copy-prompt':copyText(PROMPTS[Number(id)].text);break;case 'edit-source':editingSource=id;refreshSources();document.getElementById('source-editor-area')?.scrollIntoView({behavior:'smooth',block:'start'});break;case 'cancel-source':editingSource=null;refreshSources();break;case 'delete-source':if(confirm('¿Eliminar esta fuente del expediente?')){state.sources=state.sources.filter(s=>s.id!==id);if(editingSource===id)editingSource=null;save();refreshSources();notify('Fuente eliminada.');}break;case 'open-csv':document.getElementById('csvFile').click();break;case 'csv-template':csvTemplate();break;case 'final-tab':state.finalTab=id;save();document.getElementById('finalTabPane').innerHTML=id==='texto'?draftPane():id==='fuentes'?evidencePane():committeePane();document.querySelectorAll('[role="tab"]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.id===id)));break;case 'insert-pending':{const i=Number(id);state.drafts[i]+=(state.drafts[i]?' ':'')+'[EVIDENCIA PENDIENTE]';save();const t=document.getElementById('draft-'+i);if(t){t.value=state.drafts[i];document.getElementById('draft-count-'+i).textContent=words(t.value)+' palabras';t.focus();}break;}case 'export-md':mdExport();break;case 'report-html':reportHTML();break;case 'backup':backup();break;case 'restore':document.getElementById('backupFile').click();break;case 'reset':if(confirm('Esta acción borrará todos los datos locales de AulaEscena, incluidos los textos y fuentes. ¿Deseas continuar?')){state=defaults();save();editingSource=null;navigate('home');notify('Se restableció el recorrido en este navegador.');}break;case 'print':window.print();break;default:break;}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-goto],[data-action]');if(!target)return;if(target.hasAttribute('data-goto'))navigate(target.dataset.goto);else onAction(target);});
document.getElementById('sourceForm');document.addEventListener('submit',e=>{if(e.target.id==='sourceForm'){e.preventDefault();addSource();}});
document.addEventListener('input',e=>{const t=e.target;if(t.hasAttribute('data-note')){const n=t.dataset.note;state.notes[n]=t.value;save();const c=document.getElementById('note-count-'+n);if(c)c.textContent=words(t.value)+' palabras';}else if(t.hasAttribute('data-builder')){state.builder[t.dataset.builder]=t.value;save();updateBuilder();}else if(t.hasAttribute('data-draft')){const n=Number(t.dataset.draft);state.drafts[n]=t.value;save();const c=document.getElementById('draft-count-'+n);if(c)c.textContent=words(t.value)+' palabras';}else if(t.hasAttribute('data-defense')){state.defense[Number(t.dataset.defense)]=t.value;save();}else if(t.hasAttribute('data-time'))updateLab();});
document.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-match')){const id=t.dataset.match;state.matches[id]??={};state.matches[id][t.dataset.index]=t.value===''?'':Number(t.value);save();}else if(t.hasAttribute('data-criterion')){const id=t.dataset.criterion;if(t.value)state.criteria[id]=t.value;else delete state.criteria[id];save();const p=document.getElementById('finalTabPane');if(p){const pos=window.scrollY;p.innerHTML=committeePane();window.scrollTo({top:pos,behavior:'instant'});}}});
document.getElementById('csvFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5_000_000)throw Error('El CSV supera 5 MB. Reduce su tamaño.');const text=await file.text();importCSV(text);}catch(err){notify('No se pudo importar el CSV: '+err.message);}finally{e.target.value='';}});
document.getElementById('backupFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>6_000_000)throw Error('El respaldo supera 6 MB.');const raw=JSON.parse(await file.text());if(raw.format!=='aulaescena-evidencias-1')throw Error('Formato de respaldo no reconocido.');const incoming=sanitizeImport(raw.data);if(confirm('Importar este respaldo reemplazará el trabajo actual de este navegador. ¿Continuar?')){state=incoming;save();editingSource=null;render();notify('Respaldo recuperado.');}}catch(err){notify('No se pudo recuperar el respaldo: '+err.message);}finally{e.target.value='';}});
document.getElementById('menuBtn').addEventListener('click',()=>{const sb=document.getElementById('sidebar');const open=sb.classList.toggle('open');document.getElementById('overlay').classList.toggle('show',open);document.getElementById('menuBtn').setAttribute('aria-expanded',String(open));});
document.getElementById('overlay').addEventListener('click',closeDrawer);
document.getElementById('homeBtn').addEventListener('click',()=>navigate('home'));
document.getElementById('exportBtn').addEventListener('click',mdExport);
document.getElementById('menuDataBtn').addEventListener('click',()=>navigate('data'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
const oldRender=render;render=function(){oldRender();if(route===5)updateBuilder();};
load();render();
</script>
</body>
</html>
